CONTRACT_TYPE
{
    name = ReuseRunway1
    title = [ReuseRunway1] Corsa Riutilizzo da Pista
    group = KerbalSpaceRace
    agent = KerbalSpaceRace

    description = Dimostra le capacita' base di un sistema riutilizzabile con decollo dalla pista: inserimento orbitale, atterraggio orizzontale sulla pista, docking orbitale, rilascio di carichi utili certificati NRAP e inserimento in orbita alta.
    synopsis = Programma KSR per un veicolo riutilizzabile tipo shuttle.
    completedMessage = KSR: Corsa Riutilizzo da Pista completata. Il veicolo riutilizzabile ha dimostrato rientro su pista, docking, carichi utili pesanti e orbita alta.

    // ===== Standard KSR =====
    maxCompletions = 1
    cancellable = true
    declinable = true
    autoAccept = false

    minExpiry = 42600.0
    maxExpiry = 42600.0
    deadline = 42600

    rewardFunds = 0
    rewardReputation = 0
    rewardScience = 0
    advanceFunds = 0
    failureFunds = 0
    failureReputation = 0

    prestige = Exceptional
    targetBody = HomeWorld()

    PARAMETER
    {
        name = HorizontalReuse
        type = VesselParameterGroup
        title = Orbita con atterraggio orizzontale
        define = KSR_ReuseRunway_Orbiter
        targetBody = HomeWorld()
        completeInSequence = true
        disableOnStateChange = true
        completedMessage = KSR: veicolo riutilizzabile partito dalla pista, arrivato in orbita e atterrato sulla pista.

        PARAMETER
        {
            name = RunwayStart
            type = ReachState
            targetBody = HomeWorld()
            situation = LANDED
            biome = Runway
            disableOnStateChange = true
            title = Parti dalla pista
        }

        PARAMETER
        {
            name = OrbitGael
            type = Orbit
            targetBody = HomeWorld()
            minPeA = 70000
            disableOnStateChange = true
            title = Raggiungi un'orbita stabile attorno a Gael
        }

        PARAMETER
        {
            name = RunwayLanding
            type = ReachState
            targetBody = HomeWorld()
            situation = LANDED
            biome = Runway
            disableOnStateChange = true
            title = Atterra orizzontalmente sulla pista
        }
    }

    PARAMETER
    {
        name = FailWrongLandingAfterOrbit
        type = None
        hidden = true
        failWhenUnmet = true

        PARAMETER
        {
            name = WrongLandingAfterOrbit
            type = All
            hidden = true

            PARAMETER
            {
                name = OrbitReached
                type = Orbit
                targetBody = HomeWorld()
                minPeA = 70000
                disableOnStateChange = true
                hidden = true
            }

            PARAMETER
            {
                name = LandedAnywhere
                type = ReachState
                targetBody = HomeWorld()
                situation = LANDED
                hidden = true
            }

            PARAMETER
            {
                name = NotRunway
                type = Not
                hidden = true

                PARAMETER
                {
                    name = RunwayCheck
                    type = ReachState
                    targetBody = HomeWorld()
                    situation = LANDED
                    biome = Runway
                    hidden = true
                }
            }
        }
    }

    PARAMETER
    {
        name = DockingDemo
        type = VesselParameterGroup
        title = Docking
        define = KSR_ReuseRunway_Docking
        targetBody = HomeWorld()
        completeInSequence = true
        disableOnStateChange = true
        completedMessage = KSR: docking orbitale del veicolo riutilizzabile completato.

        PARAMETER
        {
            name = OrbitGael
            type = Orbit
            targetBody = HomeWorld()
            minPeA = 70000
            title = Raggiungi l'orbita attorno a Gael
        }

        PARAMETER
        {
            name = Docking
            type = KSRDocking
            targetBody = HomeWorld()
            title = Esegui un docking orbitale con un veicolo di un altro lancio
        }
    }

    PARAMETER
    {
        name = Payload15T
        type = All
        title = Carico utile 15T
        completeInSequence = true
        disableOnStateChange = true
        hideChildren = true
        completedMessage = KSR: carico utile separato da almeno 15 t confermato in orbita.

        PARAMETER
        {
            name = Payload15TLoaded
            type = VesselParameterGroup
            title = Payload NRAP da 15 t caricato alla partenza
            define = KSR_ReuseRunway_Carrier15T
            targetBody = HomeWorld()
            disableOnStateChange = true

            PARAMETER
            {
                name = RunwayStart
                type = ReachState
                targetBody = HomeWorld()
                situation = LANDED
                biome = Runway
                title = Veicolo sulla pista
            }

            PARAMETER
            {
                name = NRAPPayload
                type = PartValidation
                part = kerbnraptest
                part = kerbnraptest_Inline_1
                minCount = 1
                title = Payload NRAP installato a bordo
            }
        }

        PARAMETER
        {
            name = Payload15TSeparated
            type = VesselParameterGroup
            title = Payload NRAP da almeno 15 t separato in orbita
            define = KSR_ReuseRunway_Payload15T
            targetBody = HomeWorld()
            disableOnStateChange = true

            PARAMETER
            {
                name = NRAPPayload
                type = PartValidation
                part = kerbnraptest
                part = kerbnraptest_Inline_1
                minCount = 1
                title = Payload NRAP installato
            }

            PARAMETER
            {
                name = NoEngineFX
                type = PartValidation
                partModule = ModuleEnginesFX
                minCount = 0
                maxCount = 0
                title = Payload separato senza motori attivi
            }

            PARAMETER
            {
                name = NoEngine
                type = PartValidation
                partModule = ModuleEngines
                minCount = 0
                maxCount = 0
                title = Payload separato senza motori stock
            }

            PARAMETER
            {
                name = OrbitGael
                type = Orbit
                targetBody = HomeWorld()
                minPeA = 70000
                title = Payload in orbita attorno a Gael
            }

            PARAMETER
            {
                name = PayloadMass
                type = VesselMass
                minMass = 15
                title = Massa del payload almeno 15 t
            }
        }
    }

    PARAMETER
    {
        name = Payload20T
        type = All
        title = Carico utile 20T
        completeInSequence = true
        disableOnStateChange = true
        hideChildren = true
        completedMessage = KSR: carico utile separato da almeno 20 t confermato in orbita.

        PARAMETER
        {
            name = Payload20TLoaded
            type = VesselParameterGroup
            title = Payload NRAP da 20 t caricato alla partenza
            define = KSR_ReuseRunway_Carrier20T
            targetBody = HomeWorld()
            disableOnStateChange = true

            PARAMETER
            {
                name = RunwayStart
                type = ReachState
                targetBody = HomeWorld()
                situation = LANDED
                biome = Runway
                title = Veicolo sulla pista
            }

            PARAMETER
            {
                name = NRAPPayload
                type = PartValidation
                part = kerbnraptest
                part = kerbnraptest_Inline_1
                minCount = 1
                title = Payload NRAP installato a bordo
            }
        }

        PARAMETER
        {
            name = Payload20TSeparated
            type = VesselParameterGroup
            title = Payload NRAP da almeno 20 t separato in orbita
            define = KSR_ReuseRunway_Payload20T
            targetBody = HomeWorld()
            disableOnStateChange = true

            PARAMETER
            {
                name = NRAPPayload
                type = PartValidation
                part = kerbnraptest
                part = kerbnraptest_Inline_1
                minCount = 1
                title = Payload NRAP installato
            }

            PARAMETER
            {
                name = NoEngineFX
                type = PartValidation
                partModule = ModuleEnginesFX
                minCount = 0
                maxCount = 0
                title = Payload separato senza motori attivi
            }

            PARAMETER
            {
                name = NoEngine
                type = PartValidation
                partModule = ModuleEngines
                minCount = 0
                maxCount = 0
                title = Payload separato senza motori stock
            }

            PARAMETER
            {
                name = OrbitGael
                type = Orbit
                targetBody = HomeWorld()
                minPeA = 70000
                title = Payload in orbita attorno a Gael
            }

            PARAMETER
            {
                name = PayloadMass
                type = VesselMass
                minMass = 20
                title = Massa del payload almeno 20 t
            }
        }
    }

    PARAMETER
    {
        name = HighOrbit600
        type = VesselParameterGroup
        title = Orbita di 600 km
        define = KSR_ReuseRunway_Orbit600
        targetBody = HomeWorld()
        completeInSequence = true
        disableOnStateChange = true
        completedMessage = KSR: orbita di 600 km attorno a Gael confermata.

        PARAMETER
        {
            name = Orbit600
            type = Orbit
            targetBody = HomeWorld()
            minPeA = 600000
            title = Raggiungi un'orbita con periapside minimo di 600 km
        }
    }
}


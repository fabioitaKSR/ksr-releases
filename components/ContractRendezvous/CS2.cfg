CONTRACT_TYPE
{
    name = CS2
    title = [CS2] 2a Corsa allo Spazio
    group = KerbalSpaceRace
    agent = KerbalSpaceRace

    description = Completa le operazioni orbitali avanzate attorno a Gael: rendezvous, docking, orbita geostazionaria, scansione fotografica SCANsat e un volo suborbitale pilotato con velivolo sperimentale.
    synopsis = Seconda fase della corsa allo spazio attorno a Gael.
    completedMessage = La 2a Corsa allo Spazio e' completata. Il programma KSR ha dimostrato capacita' orbitali avanzate e volo sperimentale pilotato.

    // ===== Standard KSR =====
    maxCompletions = 1
    cancellable = true
    declinable = true
    autoAccept = false

    minExpiry = 42600.0
    maxExpiry = 42600.0
    deadline = 42600

    rewardFunds = 0
    rewardReputation = 0
    rewardScience = 0
    advanceFunds = 0
    failureFunds = 0
    failureReputation = 0

    prestige = Trivial
    targetBody = HomeWorld()

    PARAMETER
    {
        name = RendezvousGael
        type = VesselParameterGroup
        title = Rendezvous orbitale
        define = KSR_CS2_RendezvousGael
        targetBody = HomeWorld()
        completeInSequence = false
        disableOnStateChange = true
        completedMessage = KSR: rendezvous orbitale attorno a Gael registrato.

        PARAMETER
        {
            name = NoCrew
            type = HasCrew
            disableOnStateChange = true
            minCrew = 0
            maxCrew = 0
            title = Nessun equipaggio a bordo
        }

        PARAMETER
        {
            name = Rendezvous
            type = KSRRendezvous
            targetBody = HomeWorld()
            distance = 2000
            title = Esegui un rendezvous orbitale entro 2 km con un veicolo di un altro lancio
        }
    }

    PARAMETER
    {
        name = DockingGael
        type = VesselParameterGroup
        title = Docking orbitale
        define = KSR_CS2_DockingGael
        targetBody = HomeWorld()
        completeInSequence = false
        disableOnStateChange = true
        completedMessage = KSR: docking orbitale attorno a Gael registrato.

        PARAMETER
        {
            name = NoCrew
            type = HasCrew
            disableOnStateChange = true
            minCrew = 0
            maxCrew = 0
            title = Nessun equipaggio a bordo
        }

        PARAMETER
        {
            name = Docking
            type = KSRDocking
            targetBody = HomeWorld()
            title = Esegui un docking orbitale con un veicolo di un altro lancio
        }
    }

    PARAMETER
    {
        name = OrbitaGeostazionaria
        type = VesselParameterGroup
        title = Orbita geostazionaria
        define = KSR_CS2_OrbitaGeostazionaria
        targetBody = HomeWorld()
        completeInSequence = false
        disableOnStateChange = true
        completedMessage = KSR: orbita geostazionaria attorno a Gael registrata.

        PARAMETER
        {
            name = NoCrew
            type = HasCrew
            disableOnStateChange = true
            minCrew = 0
            maxCrew = 0
            title = Nessun equipaggio a bordo
        }

        PARAMETER
        {
            name = Orbit
            type = Orbit
            disableOnStateChange = true
            targetBody = HomeWorld()
            minPeA = 2800000
            maxApA = 2950000
            maxInclination = 1
            title = Raggiungi un'orbita geostazionaria
        }
    }

    PARAMETER
    {
        name = VoloSuborbitaleAereo
        type = VesselParameterGroup
        title = Volo suborbitale con velivolo sperimentale
        define = KSR_CS2_VoloSuborbitaleAereo
        targetBody = HomeWorld()
        completeInSequence = false
        disableOnStateChange = true
        completedMessage = KSR: volo suborbitale pilotato con velivolo sperimentale registrato.

        PARAMETER
        {
            name = HasCrew
            type = HasCrew
            disableOnStateChange = true
            minCrew = 1
            title = Almeno un kerbal a bordo
        }

        PARAMETER
        {
            name = Wings
            type = Any
            title = Installa superfici portanti
            hideChildren = true

            PARAMETER
            {
                name = StockWings
                type = PartValidation
                partModule = ModuleLiftingSurface
                minCount = 1
                title = Superfici portanti stock installate
            }

            PARAMETER
            {
                name = FARWings
                type = PartValidation
                partModule = FARWingAerodynamicModel
                minCount = 1
                title = Superfici portanti FAR installate
            }
        }

        PARAMETER
        {
            name = ControlSurfaces
            type = Any
            title = Installa superfici di controllo
            hideChildren = true

            PARAMETER
            {
                name = StockControlSurfaces
                type = PartValidation
                partModule = ModuleControlSurface
                minCount = 1
                title = Superfici di controllo stock installate
            }

            PARAMETER
            {
                name = FARControlSurfaces
                type = PartValidation
                partModule = FARControllableSurface
                minCount = 1
                title = Superfici di controllo FAR installate
            }
        }

        PARAMETER
        {
            name = LandingGear
            type = PartValidation
            partModule = ModuleWheelBase
            minCount = 1
            title = Installa carrello o ruote
        }

        PARAMETER
        {
            name = SubOrbit
            type = ReachState
            disableOnStateChange = true
            targetBody = HomeWorld()
            situation = SUB_ORBITAL
            minAltitude = 70000
            title = Raggiungi una traiettoria suborbitale
        }
    }

    PARAMETER
    {
        name = SCANsatCoverage_VisualLoRes
        type = SCANsatCoverage
        targetBody = HomeWorld()
        coverage = 90.0
        scanType = VisualLoRes
        title = Scansione fotografica di Gael al 90%
        disableOnStateChange = true
        completedMessage = KSR: scansione fotografica di Gael completata al 90%.
    }

    PARAMETER
    {
        name = SCANsatCoverage_AltimetryHiRes
        type = SCANsatCoverage
        targetBody = HomeWorld()
        coverage = 90.0
        scanType = AltimetryHiRes
        disableOnStateChange = true
        completedMessage = KSR: scansione altimetrica ad alta definizione completata al 90%.
    }

    PARAMETER
    {
        name = SCANsatCoverage_Biome
        type = SCANsatCoverage
        targetBody = HomeWorld()
        coverage = 90.0
        scanType = Biome
        disableOnStateChange = true
        completedMessage = KSR: scansione biomi completata al 90%.
    }
    PARAMETER
    {
        name = RecoverCrewCS2
        type = VesselParameterGroup
        title = Recupera l'equipaggio al KSC
        vessel = KSR_CS2_VoloSuborbitaleAereo
        completeInSequence = false
        disableOnStateChange = true
        hideChildren = true
        completedMessage = KSR: equipaggio recuperato al KSC.

        PARAMETER
        {
            name = HasCrew
            type = HasCrew
            minCrew = 1
            title = Almeno un kerbal a bordo
            disableOnStateChange = true
        }

        PARAMETER
        {
            name = ReturnHome
            type = ReturnHome
            title = Recupera l'equipaggio al KSC
            disableOnStateChange = true
        }
    }}

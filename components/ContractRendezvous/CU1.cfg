CONTRACT_TYPE
{
    name = CU1
    title = [CU1] 1a Corsa Umana
    group = KerbalSpaceRace
    agent = KerbalSpaceRace

    description = Completa le prime missioni con equipaggio attorno a Gael: volo spaziale, orbita, EVA, rendezvous, docking e permanenza orbitale multi-crew.
    synopsis = Prima fase della corsa umana allo spazio attorno a Gael.
    completedMessage = La 1a Corsa Umana e' completata. Il programma KSR ha portato i Kerbal in orbita e ha dimostrato le prime operazioni orbitali con equipaggio.

    // ===== Standard KSR =====
    maxCompletions = 1
    cancellable = true
    declinable = true
    autoAccept = false

    minExpiry = 42600.0
    maxExpiry = 42600.0
    deadline = 42600

    rewardFunds = 0
    rewardReputation = 0
    rewardScience = 0
    advanceFunds = 0
    failureFunds = 0
    failureReputation = 0

    prestige = Exceptional
    targetBody = HomeWorld()

    PARAMETER
    {
        name = FlybyGaelCrew
        type = VesselParameterGroup
        title = Fly-by / primo volo spaziale con equipaggio di Gael
        define = KSR_CU1_FlybyGaelCrew
        targetBody = HomeWorld()
        completeInSequence = false
        disableOnStateChange = true
        completedMessage = KSR: primo volo spaziale con equipaggio registrato.

        PARAMETER
        {
            name = HasCrew
            type = HasCrew
            disableOnStateChange = true
            minCrew = 1
            title = Almeno un kerbal a bordo
        }

        PARAMETER
        {
            name = ReachSpace
            type = ReachState
            disableOnStateChange = true
            targetBody = HomeWorld()
            situation = SUB_ORBITAL
            minAltitude = 70000
            title = Raggiungi lo spazio sopra Gael
        }
    }

    PARAMETER
    {
        name = OrbitGaelCrew
        type = VesselParameterGroup
        title = Orbita con equipaggio attorno a Gael
        define = KSR_CU1_OrbitGaelCrew
        targetBody = HomeWorld()
        completeInSequence = false
        disableOnStateChange = true
        completedMessage = KSR: prima orbita con equipaggio attorno a Gael registrata.

        PARAMETER
        {
            name = HasCrew
            type = HasCrew
            disableOnStateChange = true
            minCrew = 1
            title = Almeno un kerbal a bordo
        }

        PARAMETER
        {
            name = Orbit
            type = Orbit
            disableOnStateChange = true
            targetBody = HomeWorld()
            minPeA = 70000
            title = Entra in orbita attorno a Gael
        }
    }

    PARAMETER
    {
        name = EVAGaelOrbit
        type = VesselParameterGroup
        title = EVA in orbita attorno a Gael
        define = KSR_CU1_EVAGaelOrbit
        targetBody = HomeWorld()
        completeInSequence = false
        disableOnStateChange = true
        completedMessage = KSR: prima EVA orbitale attorno a Gael registrata.

        PARAMETER
        {
            name = EVAType
            type = VesselIsType
            vesselType = EVA
            title = Kerbal in EVA
        }

        PARAMETER
        {
            name = EVAOrbit
            type = Orbit
            minPeA = 1
            disableOnStateChange = true
            targetBody = HomeWorld()
            title = EVA in orbita attorno a Gael
        }
    }

    PARAMETER
    {
        name = RendezvousGaelCrew
        type = VesselParameterGroup
        title = Rendezvous con equipaggio
        define = KSR_CU1_RendezvousGaelCrew
        targetBody = HomeWorld()
        completeInSequence = false
        disableOnStateChange = true
        completedMessage = KSR: rendezvous con equipaggio attorno a Gael registrato.

        PARAMETER
        {
            name = HasCrew
            type = HasCrew
            disableOnStateChange = true
            minCrew = 1
            title = Almeno un kerbal a bordo
        }

        PARAMETER
        {
            name = Rendezvous
            type = KSRRendezvous
            targetBody = HomeWorld()
            distance = 2000
            title = Esegui un rendezvous orbitale entro 2 km con un veicolo di un altro lancio
        }
    }

    PARAMETER
    {
        name = DockingGaelCrew
        type = VesselParameterGroup
        title = Docking con equipaggio
        define = KSR_CU1_DockingGaelCrew
        targetBody = HomeWorld()
        completeInSequence = false
        disableOnStateChange = true
        completedMessage = KSR: docking con equipaggio attorno a Gael registrato.

        PARAMETER
        {
            name = HasCrew
            type = HasCrew
            disableOnStateChange = true
            minCrew = 1
            title = Almeno un kerbal a bordo
        }

        PARAMETER
        {
            name = Docking
            type = KSRDocking
            targetBody = HomeWorld()
            title = Esegui un docking orbitale con un veicolo di un altro lancio
        }
    }

    PARAMETER
    {
        name = OrbitaMultiCrew
        type = VesselParameterGroup
        title = Orbita multi-crew attorno a Gael
        define = KSR_CU1_OrbitaMultiCrew
        targetBody = HomeWorld()
        completeInSequence = false
        disableOnStateChange = true
        completedMessage = KSR: orbita multi-crew attorno a Gael registrata.

        PARAMETER
        {
            name = HasCrew
            type = HasCrew
            disableOnStateChange = true
            minCrew = 2
            title = Almeno due kerbal a bordo
        }

        PARAMETER
        {
            name = Orbit
            type = Orbit
            disableOnStateChange = true
            targetBody = HomeWorld()
            minPeA = 70000
            title = Mantieni un'orbita multi-crew attorno a Gael
        }
    }
    PARAMETER
    {
        name = RecoverCrewCU1
        type = VesselParameterGroup
        title = Recupera l'equipaggio al KSC
        vessel = KSR_CU1_OrbitaMultiCrew
        completeInSequence = false
        disableOnStateChange = true
        hideChildren = true
        completedMessage = KSR: equipaggio recuperato al KSC.

        PARAMETER
        {
            name = HasCrew
            type = HasCrew
            minCrew = 1
            title = Almeno un kerbal a bordo
            disableOnStateChange = true
        }

        PARAMETER
        {
            name = ReturnHome
            type = ReturnHome
            title = Recupera l'equipaggio al KSC
            disableOnStateChange = true
        }
    }}

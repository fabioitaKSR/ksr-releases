// Reusable vehicles:
// Base reusable vehicle requires first crewed race, first Iota/Ceti race, and VOLOSUB marker.
// Runway reusable vehicle requires the base reusable vehicle.

@CONTRACT_TYPE[ReuseBase1]
{
    REQUIREMENT
    {
        name = CompleteCU1
        type = CompleteContract
        contractType = CU1
    }

    REQUIREMENT
    {
        name = CompleteIota1OrCeti1
        type = Any
        hideChildren = true

        REQUIREMENT
        {
            name = CompleteIota1
            type = CompleteContract
            contractType = Iota1
        }

        REQUIREMENT
        {
            name = CompleteCeti1
            type = CompleteContract
            contractType = Ceti1
        }
    }

    REQUIREMENT
    {
        name = CompleteVOLOSUB
        type = CompleteContract
        contractType = VOLOSUB
    }
}

@CONTRACT_TYPE[ReuseRunway1]
{
    REQUIREMENT
    {
        name = CompleteReuseBase1
        type = CompleteContract
        contractType = ReuseBase1
    }
}



// KSR rule: a high-resolution SCANsat sensor also collects the corresponding
// low-resolution coverage. Other scan capabilities in combined bitmasks are
// preserved.

// Altimetry: AltimetryHiRes (2) also includes AltimetryLoRes (1).
@PART[*]:HAS[@MODULE[SCANsat]:HAS[#sensorType[2]]]:NEEDS[SCANsat]:FINAL
{
	@MODULE[SCANsat]:HAS[#sensorType[2]]
	{
		@sensorType = 3
	}
}

@PART[*]:HAS[@MODULE[SCANsat]:HAS[#sensorType[10]]]:NEEDS[SCANsat]:FINAL
{
	@MODULE[SCANsat]:HAS[#sensorType[10]]
	{
		@sensorType = 11
	}
}

// Visual: VisualHiRes (64) also includes VisualLoRes (4).
@PART[*]:HAS[@MODULE[SCANsat]:HAS[#sensorType[64]]]:NEEDS[SCANsat]:FINAL
{
	@MODULE[SCANsat]:HAS[#sensorType[64]]
	{
		@sensorType = 68
	}
}

@PART[*]:HAS[@MODULE[SCANsat]:HAS[#sensorType[80]]]:NEEDS[SCANsat]:FINAL
{
	@MODULE[SCANsat]:HAS[#sensorType[80]]
	{
		@sensorType = 84
	}
}

// Resources: ResourceHiRes (256) also includes ResourceLoRes (128).
@PART[*]:HAS[@MODULE[SCANsat]:HAS[#sensorType[256]]]:NEEDS[SCANsat]:FINAL
{
	@MODULE[SCANsat]:HAS[#sensorType[256]]
	{
		@sensorType = 384
	}
}

@PART[*]:HAS[@MODULE[ModuleSCANresourceScanner]:HAS[#sensorType[256]]]:NEEDS[SCANsat]:FINAL
{
	@MODULE[ModuleSCANresourceScanner]:HAS[#sensorType[256]]
	{
		@sensorType = 384
	}
}

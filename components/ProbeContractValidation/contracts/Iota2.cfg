CONTRACT_TYPE
{
    name = Iota2
    title = [Iota2] 2a Corsa ai Satelliti - Iota
    group = KerbalSpaceRace
    agent = KerbalSpaceRace

    description = Completa la seconda campagna automatica su Iota: scansione biomi, scansione H.D., rover avanzato, scansione Ore, test di estrazione, scansione anomalie e ritorno di un campione dalla superficie.
    synopsis = Seconda campagna automatica avanzata su Iota.
    completedMessage = 2a Corsa ai Satelliti - Iota completata. Il programma KSR dispone ora di mappe avanzate, dati minerari e campioni recuperati da Iota.

    maxCompletions = 1
    cancellable = true
    declinable = true
    autoAccept = false

    minExpiry = 42600.0
    maxExpiry = 42600.0
    deadline = 42600

    rewardFunds = 0
    rewardReputation = 0
    rewardScience = 0
    advanceFunds = 0
    failureFunds = 0
    failureReputation = 0

    prestige = Significant
    targetBody = Iota

    PARAMETER
    {
        name = SCANsatCoverage_Biome
        type = SCANsatCoverage
        targetBody = Iota
        coverage = 90.0
        scanType = Biome
        title = Scansione biomi di Iota al 90%
        disableOnStateChange = true
        completedMessage = KSR: scansione biomi di Iota completata al 90%.
    }

    PARAMETER
    {
        name = SCANsatCoverage_AltimetryHiRes
        type = SCANsatCoverage
        targetBody = Iota
        coverage = 90.0
        scanType = AltimetryHiRes
        title = Scansione H.D. di Iota al 90%
        disableOnStateChange = true
        completedMessage = KSR: scansione H.D. di Iota completata al 90%.
    }

    PARAMETER
    {
        name = AdvancedRoverIota
        type = VesselParameterGroup
        title = Rover avanzato su Iota
        define = KSR_Iota2_AdvancedRover
        targetBody = Iota
        completeInSequence = false
        disableOnStateChange = true
        completedMessage = KSR: rover avanzato su Iota registrato.

        PARAMETER
        {
            name = NewVessel
            type = NewVessel
            disableOnStateChange = true
            title = Nuovo veicolo
        }

        PARAMETER
        {
            name = NoCrew
            type = HasCrew
            minCrew = 0
            maxCrew = 0
            title = Nessun equipaggio a bordo
        }

        PARAMETER
        {
            name = Landed
            type = ReachState
            targetBody = Iota
            situation = LANDED
            title = Atterra il rover avanzato su Iota
        }

        PARAMETER
        {
            name = RoverWheels
            type = PartValidation
            partModule = ModuleWheelMotor
            minCount = 4
            title = Rover con almeno 4 ruote
        }

        PARAMETER
        {
            name = ScanArm
            type = PartValidation
            partModule = ModuleRobotArmScanner
            minCount = 1
            title = Braccio scanner installato
        }

        PARAMETER
        {
            name = ProbeIntegrity
            type = VesselNotDestroyed
            title = Mantieni il rover integro e operativo
        }

        PARAMETER
        {
            name = ProbeTransmission
            type = CollectScience
            targetBody = Iota
            location = Surface
            recoveryMethod = Transmit
            title = Trasmetti dati scientifici dalla superficie di Iota con il rover
            disableOnStateChange = true
        }
    }

    PARAMETER
    {
        name = SCANsatCoverage_ResourceLoRes
        type = SCANsatCoverage
        targetBody = Iota
        coverage = 90.0
        scanType = ResourceLoRes
        title = Scansione bassa definizione Ore di Iota al 90%
        disableOnStateChange = true
        completedMessage = KSR: scansione Ore di Iota completata al 90%.
    }

    PARAMETER
    {
        name = ExtractionTestIota
        type = VesselParameterGroup
        title = Test estrazione Ore su Iota
        define = KSR_Iota2_ExtractionTest
        targetBody = Iota
        completeInSequence = false
        disableOnStateChange = true
        completedMessage = KSR: test estrazione Ore su Iota completato.

        PARAMETER
        {
            name = NoCrew
            type = HasCrew
            minCrew = 0
            maxCrew = 0
            title = Nessun equipaggio a bordo
        }

        PARAMETER
        {
            name = Landed
            type = ReachState
            targetBody = Iota
            situation = LANDED
            title = Atterra il mezzo minerario su Iota
        }

        PARAMETER
        {
            name = Drill
            type = Any
            title = Trivella mineraria installata
            hideChildren = false

            PARAMETER
            {
                name = KerbalismOreHarvester
                type = PartValidation
                partModule = Harvester
                minCount = 1
                title = Trivella Kerbalism installata
            }

            PARAMETER
            {
                name = StockOreHarvester
                type = PartValidation
                partModule = ModuleResourceHarvester
                minCount = 1
                title = Trivella stock installata
            }
        }

        PARAMETER
        {
            name = OreCollected
            type = HasResource
            resource = Ore
            minQuantity = 100
            title = Estrai almeno 100 Ore
        }
    }

    PARAMETER
    {
        name = SCANsatCoverage_Anomaly
        type = SCANsatCoverage
        targetBody = Iota
        coverage = 90.0
        scanType = Anomaly
        title = Scansione anomalie di Iota al 90%
        disableOnStateChange = true
        completedMessage = KSR: scansione anomalie di Iota completata al 90%.
    }

    PARAMETER
    {
        name = SampleReturnIota
        type = CollectScience
        targetBody = Iota
        location = Surface
        experiment = surfaceSample
        recoveryMethod = Recover
        title = Ritorna un campione dalla superficie di Iota
        disableOnStateChange = true
        hideChildren = true
        completedMessage = KSR: campione di superficie di Iota recuperato.
    }
}


CONTRACT_TYPE
{
    name = Gratian1
    title = [Gratian1] 1a Corsa a Gratian
    group = KerbalSpaceRace
    agent = KerbalSpaceRace

    description = Completa la prima missione automatica verso Gratian: fly-by, orbita, atterraggio, rover, scansione altimetrica a bassa definizione e scansione fotografica.
    synopsis = Prima campagna automatica su Gratian.
    completedMessage = La 1a Corsa a Gratian e' completata. Il programma KSR ha raggiunto, mappato e toccato Gratian.

    // ===== Standard KSR =====
    maxCompletions = 1
    cancellable = true
    declinable = true
    autoAccept = false

    minExpiry = 42600.0
    maxExpiry = 42600.0
    deadline = 42600

    rewardFunds = 0
    rewardReputation = 0
    rewardScience = 0
    advanceFunds = 0
    failureFunds = 0
    failureReputation = 0

    prestige = Significant
    targetBody = Gratian

    PARAMETER
    {
        name = FlybyGratian
        type = VesselParameterGroup
        title = Fly-by di Gratian
        define = KSR_Gratian1_Flyby
        targetBody = Gratian
        completeInSequence = false
        disableOnStateChange = true
        completedMessage = KSR: fly-by automatico di Gratian registrato.

        PARAMETER
        {
            name = NoCrew
            type = HasCrew
            minCrew = 0
            maxCrew = 0
            title = Nessun equipaggio a bordo
        }

        PARAMETER
        {
            name = ReachGratian
            type = ReachState
            targetBody = Gratian
            title = Entra nella SOI di Gratian
        }
    }

    PARAMETER
    {
        name = OrbitGratian
        type = VesselParameterGroup
        title = Orbita attorno a Gratian
        define = KSR_Gratian1_Orbit
        targetBody = Gratian
        completeInSequence = false
        disableOnStateChange = true
        completedMessage = KSR: orbita automatica attorno a Gratian registrata.

        PARAMETER
        {
            name = NoCrew
            type = HasCrew
            minCrew = 0
            maxCrew = 0
            title = Nessun equipaggio a bordo
        }

        PARAMETER
        {
            name = Orbit
            type = Orbit
            minPeA = 1
            targetBody = Gratian
            title = Entra in orbita attorno a Gratian
        }
    }

    PARAMETER
    {
        name = LandingGratian
        type = VesselParameterGroup
        title = Atterraggio su Gratian
        define = KSR_Gratian1_Landing
        targetBody = Gratian
        completeInSequence = false
        disableOnStateChange = true
        completedMessage = KSR: atterraggio automatico su Gratian registrato.

        PARAMETER
        {
            name = NewVessel
            type = NewVessel
            disableOnStateChange = true
            title = Nuovo veicolo
        }

        PARAMETER
        {
            name = NoCrew
            type = HasCrew
            minCrew = 0
            maxCrew = 0
            title = Nessun equipaggio a bordo
        }

        PARAMETER
        {
            name = Landed
            type = ReachState
            targetBody = Gratian
            situation = LANDED
            title = Atterra su Gratian
        }

        PARAMETER
        {
            name = ProbeIntegrity
            type = VesselNotDestroyed
            title = Mantieni il lander integro e operativo
        }

        PARAMETER
        {
            name = ProbeTransmission
            type = CollectScience
            targetBody = Gratian
            location = Surface
            recoveryMethod = Transmit
            title = Trasmetti dati scientifici dalla superficie di Gratian con il lander
            disableOnStateChange = true
        }
    }

    PARAMETER
    {
        name = RoverGratian
        type = VesselParameterGroup
        title = Rover su Gratian
        define = KSR_Gratian1_Rover
        targetBody = Gratian
        completeInSequence = false
        disableOnStateChange = true
        completedMessage = KSR: rover automatico su Gratian registrato.

        PARAMETER
        {
            name = NewVessel
            type = NewVessel
            disableOnStateChange = true
            title = Nuovo veicolo
        }

        PARAMETER
        {
            name = NoCrew
            type = HasCrew
            minCrew = 0
            maxCrew = 0
            title = Nessun equipaggio a bordo
        }

        PARAMETER
        {
            name = Landed
            type = ReachState
            targetBody = Gratian
            situation = LANDED
            title = Atterra il rover su Gratian
        }

        PARAMETER
        {
            name = RoverWheels
            type = PartValidation
            partModule = ModuleWheelMotor
            minCount = 4
            title = Rover con almeno 4 ruote
        }

        PARAMETER
        {
            name = ProbeIntegrity
            type = VesselNotDestroyed
            title = Mantieni il rover integro e operativo
        }

        PARAMETER
        {
            name = ProbeTransmission
            type = CollectScience
            targetBody = Gratian
            location = Surface
            recoveryMethod = Transmit
            title = Trasmetti dati scientifici dalla superficie di Gratian con il rover
            disableOnStateChange = true
        }
    }

    PARAMETER
    {
        name = SCANsatCoverage_AltimetryLoRes
        type = SCANsatCoverage
        targetBody = Gratian
        coverage = 90.0
        scanType = AltimetryLoRes
        title = Scansione altimetrica L.D. di Gratian al 90%
        disableOnStateChange = true
        completedMessage = KSR: scansione altimetrica L.D. di Gratian completata al 90%.
    }

    PARAMETER
    {
        name = SCANsatCoverage_VisualLoRes
        type = SCANsatCoverage
        targetBody = Gratian
        coverage = 90.0
        scanType = VisualLoRes
        title = Scansione fotografica di Gratian al 90%
        disableOnStateChange = true
        completedMessage = KSR: scansione fotografica di Gratian completata al 90%.
    }
}

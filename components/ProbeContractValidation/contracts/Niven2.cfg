CONTRACT_TYPE
{
    name = Niven2
    title = [Niven2] 2a Corsa Pianeti Interni - Niven
    group = KerbalSpaceRace
    agent = KerbalSpaceRace

    description = Completa la seconda campagna automatica su Niven: scansione ad alta definizione, scansione biomi, rover avanzato con braccio scanner, scansione orbitale delle anomalie e ritorno di un campione dalla superficie.
    synopsis = Seconda campagna automatica su Niven.
    completedMessage = 2a Corsa Pianeti Interni - Niven completata. Il programma KSR dispone di mappe avanzate, dati di superficie e campioni recuperati da Niven.

    maxCompletions = 1
    cancellable = true
    declinable = true
    autoAccept = false

    minExpiry = 42600.0
    maxExpiry = 42600.0
    deadline = 42600

    rewardFunds = 0
    rewardReputation = 0
    rewardScience = 0
    advanceFunds = 0
    failureFunds = 0
    failureReputation = 0

    prestige = Significant
    targetBody = Niven

    PARAMETER
    {
        name = SCANsatCoverage_AltimetryHiRes
        type = SCANsatCoverage
        targetBody = Niven
        coverage = 90.0
        scanType = AltimetryHiRes
        title = Scansione H.D. di Niven al 90%
        disableOnStateChange = true
        completedMessage = KSR: scansione H.D. di Niven completata al 90%.
    }

    PARAMETER
    {
        name = SCANsatCoverage_Biome
        type = SCANsatCoverage
        targetBody = Niven
        coverage = 90.0
        scanType = Biome
        title = Scansione biomi di Niven al 90%
        disableOnStateChange = true
        completedMessage = KSR: scansione biomi di Niven completata al 90%.
    }

    PARAMETER
    {
        name = AdvancedRoverNiven
        type = VesselParameterGroup
        title = Rover avanzato su Niven
        define = KSR_Niven2_AdvancedRover
        targetBody = Niven
        completeInSequence = false
        disableOnStateChange = true
        completedMessage = KSR: rover avanzato su Niven registrato.

        PARAMETER
        {
            name = NewVessel
            type = NewVessel
            disableOnStateChange = true
            title = Nuovo veicolo
        }

        PARAMETER
        {
            name = NoCrew
            type = HasCrew
            minCrew = 0
            maxCrew = 0
            title = Nessun equipaggio a bordo
        }

        PARAMETER
        {
            name = Landed
            type = ReachState
            targetBody = Niven
            situation = LANDED
            title = Atterra il rover avanzato su Niven
        }

        PARAMETER
        {
            name = RoverWheels
            type = PartValidation
            partModule = ModuleWheelMotor
            minCount = 4
            title = Rover con almeno 4 ruote
        }

        PARAMETER
        {
            name = ScanArm
            type = PartValidation
            partModule = ModuleRobotArmScanner
            minCount = 1
            title = Braccio scanner installato
        }

        PARAMETER
        {
            name = ProbeIntegrity
            type = VesselNotDestroyed
            title = Mantieni il rover integro e operativo
        }

        PARAMETER
        {
            name = ProbeTransmission
            type = CollectScience
            targetBody = Niven
            location = Surface
            recoveryMethod = Transmit
            title = Trasmetti dati scientifici dalla superficie di Niven con il rover
            disableOnStateChange = true
        }
    }

    PARAMETER
    {
        name = SCANsatCoverage_Anomaly
        type = SCANsatCoverage
        targetBody = Niven
        coverage = 90.0
        scanType = Anomaly
        title = Scansione anomalie di Niven al 90%
        disableOnStateChange = true
        completedMessage = KSR: scansione anomalie di Niven completata al 90%.
    }

    PARAMETER
    {
        name = SampleReturnNiven
        type = CollectScience
        targetBody = Niven
        location = Surface
        experiment = surfaceSample
        recoveryMethod = Recover
        title = Ritorna un campione dalla superficie di Niven
        disableOnStateChange = true
        hideChildren = true
        completedMessage = KSR: campione di superficie di Niven recuperato.
    }
}

CONTRACT_TYPE
{
    name = Ceti1
    title = [Ceti1] 1a Corsa a Ceti
    group = KerbalSpaceRace
    agent = KerbalSpaceRace

    description = Completa la prima missione automatica verso Ceti: fly-by, orbita, atterraggio, rover, scansione altimetrica a bassa definizione e scansione fotografica.
    synopsis = Prima campagna automatica su Ceti.
    completedMessage = La 1a Corsa a Ceti e' completata. Il programma KSR ha raggiunto, mappato e toccato il secondo satellite di Gael.

    // ===== Standard KSR =====
    maxCompletions = 1
    cancellable = true
    declinable = true
    autoAccept = false

    minExpiry = 42600.0
    maxExpiry = 42600.0
    deadline = 42600

    rewardFunds = 0
    rewardReputation = 0
    rewardScience = 0
    advanceFunds = 0
    failureFunds = 0
    failureReputation = 0

    prestige = Significant
    targetBody = Ceti

    PARAMETER
    {
        name = FlybyCeti
        type = VesselParameterGroup
        title = Fly-by di Ceti
        define = KSR_Ceti1_Flyby
        targetBody = Ceti
        completeInSequence = false
        disableOnStateChange = true
        completedMessage = KSR: fly-by automatico di Ceti registrato.

        PARAMETER
        {
            name = NoCrew
            type = HasCrew
            minCrew = 0
            maxCrew = 0
            title = Nessun equipaggio a bordo
        }

        PARAMETER
        {
            name = ReachCeti
            type = ReachState
            targetBody = Ceti
            title = Entra nella SOI di Ceti
        }
    }

    PARAMETER
    {
        name = OrbitCeti
        type = VesselParameterGroup
        title = Orbita attorno a Ceti
        define = KSR_Ceti1_Orbit
        targetBody = Ceti
        completeInSequence = false
        disableOnStateChange = true
        completedMessage = KSR: orbita automatica attorno a Ceti registrata.

        PARAMETER
        {
            name = NoCrew
            type = HasCrew
            minCrew = 0
            maxCrew = 0
            title = Nessun equipaggio a bordo
        }

        PARAMETER
        {
            name = Orbit
            type = Orbit
            targetBody = Ceti
            minPeA = 10000
            title = Entra in orbita attorno a Ceti
        }
    }

    PARAMETER
    {
        name = LandingCeti
        type = VesselParameterGroup
        title = Atterraggio su Ceti
        define = KSR_Ceti1_Landing
        targetBody = Ceti
        completeInSequence = false
        disableOnStateChange = true
        completedMessage = KSR: atterraggio automatico su Ceti registrato.

        PARAMETER
        {
            name = NewVessel
            type = NewVessel
            disableOnStateChange = true
            title = Nuovo veicolo
        }

        PARAMETER
        {
            name = NoCrew
            type = HasCrew
            minCrew = 0
            maxCrew = 0
            title = Nessun equipaggio a bordo
        }

        PARAMETER
        {
            name = Landed
            type = ReachState
            targetBody = Ceti
            situation = LANDED
            title = Atterra su Ceti
        }

        PARAMETER
        {
            name = ProbeIntegrity
            type = VesselNotDestroyed
            title = Mantieni il lander integro e operativo
        }

        PARAMETER
        {
            name = ProbeTransmission
            type = CollectScience
            targetBody = Ceti
            location = Surface
            recoveryMethod = Transmit
            title = Trasmetti dati scientifici dalla superficie di Ceti con il lander
            disableOnStateChange = true
        }
    }

    PARAMETER
    {
        name = RoverCeti
        type = VesselParameterGroup
        title = Rover su Ceti
        define = KSR_Ceti1_Rover
        targetBody = Ceti
        completeInSequence = false
        disableOnStateChange = true
        completedMessage = KSR: rover automatico su Ceti registrato.

        PARAMETER
        {
            name = NewVessel
            type = NewVessel
            disableOnStateChange = true
            title = Nuovo veicolo
        }

        PARAMETER
        {
            name = NoCrew
            type = HasCrew
            minCrew = 0
            maxCrew = 0
            title = Nessun equipaggio a bordo
        }

        PARAMETER
        {
            name = Landed
            type = ReachState
            targetBody = Ceti
            situation = LANDED
            title = Atterra il rover su Ceti
        }

        PARAMETER
        {
            name = RoverWheels
            type = PartValidation
            partModule = ModuleWheelMotor
            minCount = 4
            title = Rover con almeno 4 ruote
        }

        PARAMETER
        {
            name = ProbeIntegrity
            type = VesselNotDestroyed
            title = Mantieni il rover integro e operativo
        }

        PARAMETER
        {
            name = ProbeTransmission
            type = CollectScience
            targetBody = Ceti
            location = Surface
            recoveryMethod = Transmit
            title = Trasmetti dati scientifici dalla superficie di Ceti con il rover
            disableOnStateChange = true
        }
    }

    PARAMETER
    {
        name = SCANsatCoverage_AltimetryLoRes
        type = SCANsatCoverage
        targetBody = Ceti
        coverage = 90.0
        scanType = AltimetryLoRes
        title = Scansione altimetrica L.D. di Ceti al 90%
        disableOnStateChange = true
        completedMessage = KSR: scansione altimetrica L.D. di Ceti completata al 90%.
    }

    PARAMETER
    {
        name = SCANsatCoverage_VisualLoRes
        type = SCANsatCoverage
        targetBody = Ceti
        coverage = 90.0
        scanType = VisualLoRes
        title = Scansione fotografica di Ceti al 90%
        disableOnStateChange = true
        completedMessage = KSR: scansione fotografica di Ceti completata al 90%.
    }
}

CONTRACT_TYPE
{
    name = Hox1
    title = [Hox1] 1a Corsa a Hox
    group = KerbalSpaceRace
    agent = KerbalSpaceRace

    description = Completa la prima missione automatica verso Hox: fly-by, orbita, atterraggio, rover, scansione altimetrica a bassa definizione e scansione fotografica.
    synopsis = Prima campagna automatica su Hox.
    completedMessage = La 1a Corsa a Hox e' completata. Il programma KSR ha raggiunto, mappato e toccato Hox.

    // ===== Standard KSR =====
    maxCompletions = 1
    cancellable = true
    declinable = true
    autoAccept = false

    minExpiry = 42600.0
    maxExpiry = 42600.0
    deadline = 42600

    rewardFunds = 0
    rewardReputation = 0
    rewardScience = 0
    advanceFunds = 0
    failureFunds = 0
    failureReputation = 0

    prestige = Significant
    targetBody = Hox

    PARAMETER
    {
        name = FlybyHox
        type = VesselParameterGroup
        title = Fly-by di Hox
        define = KSR_Hox1_Flyby
        targetBody = Hox
        completeInSequence = false
        disableOnStateChange = true
        completedMessage = KSR: fly-by automatico di Hox registrato.

        PARAMETER
        {
            name = NoCrew
            type = HasCrew
            minCrew = 0
            maxCrew = 0
            title = Nessun equipaggio a bordo
        }

        PARAMETER
        {
            name = ReachHox
            type = ReachState
            targetBody = Hox
            title = Entra nella SOI di Hox
        }
    }

    PARAMETER
    {
        name = OrbitHox
        type = VesselParameterGroup
        title = Orbita attorno a Hox
        define = KSR_Hox1_Orbit
        targetBody = Hox
        completeInSequence = false
        disableOnStateChange = true
        completedMessage = KSR: orbita automatica attorno a Hox registrata.

        PARAMETER
        {
            name = NoCrew
            type = HasCrew
            minCrew = 0
            maxCrew = 0
            title = Nessun equipaggio a bordo
        }

        PARAMETER
        {
            name = Orbit
            type = Orbit
            minPeA = 1
            targetBody = Hox
            title = Entra in orbita attorno a Hox
        }
    }

    PARAMETER
    {
        name = LandingHox
        type = VesselParameterGroup
        title = Atterraggio su Hox
        define = KSR_Hox1_Landing
        targetBody = Hox
        completeInSequence = false
        disableOnStateChange = true
        completedMessage = KSR: atterraggio automatico su Hox registrato.

        PARAMETER
        {
            name = NewVessel
            type = NewVessel
            disableOnStateChange = true
            title = Nuovo veicolo
        }

        PARAMETER
        {
            name = NoCrew
            type = HasCrew
            minCrew = 0
            maxCrew = 0
            title = Nessun equipaggio a bordo
        }

        PARAMETER
        {
            name = Landed
            type = ReachState
            targetBody = Hox
            situation = LANDED
            title = Atterra su Hox
        }

        PARAMETER
        {
            name = ProbeIntegrity
            type = VesselNotDestroyed
            title = Mantieni il lander integro e operativo
        }

        PARAMETER
        {
            name = ProbeTransmission
            type = CollectScience
            targetBody = Hox
            location = Surface
            recoveryMethod = Transmit
            title = Trasmetti dati scientifici dalla superficie di Hox con il lander
            disableOnStateChange = true
        }
    }

    PARAMETER
    {
        name = RoverHox
        type = VesselParameterGroup
        title = Rover su Hox
        define = KSR_Hox1_Rover
        targetBody = Hox
        completeInSequence = false
        disableOnStateChange = true
        completedMessage = KSR: rover automatico su Hox registrato.

        PARAMETER
        {
            name = NewVessel
            type = NewVessel
            disableOnStateChange = true
            title = Nuovo veicolo
        }

        PARAMETER
        {
            name = NoCrew
            type = HasCrew
            minCrew = 0
            maxCrew = 0
            title = Nessun equipaggio a bordo
        }

        PARAMETER
        {
            name = Landed
            type = ReachState
            targetBody = Hox
            situation = LANDED
            title = Atterra il rover su Hox
        }

        PARAMETER
        {
            name = RoverWheels
            type = PartValidation
            partModule = ModuleWheelMotor
            minCount = 4
            title = Rover con almeno 4 ruote
        }

        PARAMETER
        {
            name = ProbeIntegrity
            type = VesselNotDestroyed
            title = Mantieni il rover integro e operativo
        }

        PARAMETER
        {
            name = ProbeTransmission
            type = CollectScience
            targetBody = Hox
            location = Surface
            recoveryMethod = Transmit
            title = Trasmetti dati scientifici dalla superficie di Hox con il rover
            disableOnStateChange = true
        }
    }

    PARAMETER
    {
        name = SCANsatCoverage_AltimetryLoRes
        type = SCANsatCoverage
        targetBody = Hox
        coverage = 90.0
        scanType = AltimetryLoRes
        title = Scansione altimetrica L.D. di Hox al 90%
        disableOnStateChange = true
        completedMessage = KSR: scansione altimetrica L.D. di Hox completata al 90%.
    }

    PARAMETER
    {
        name = SCANsatCoverage_VisualLoRes
        type = SCANsatCoverage
        targetBody = Hox
        coverage = 90.0
        scanType = VisualLoRes
        title = Scansione fotografica di Hox al 90%
        disableOnStateChange = true
        completedMessage = KSR: scansione fotografica di Hox completata al 90%.
    }
}

CONTRACT_TYPE
{
    name = Thalia1
    title = [Thalia1] 1a Corsa a Thalia
    group = KerbalSpaceRace
    agent = KerbalSpaceRace

    description = Completa la prima missione automatica verso Thalia: fly-by, orbita, atterraggio, rover, scansione altimetrica a bassa definizione e scansione fotografica.
    synopsis = Prima campagna automatica su Thalia.
    completedMessage = La 1a Corsa a Thalia e' completata. Il programma KSR ha raggiunto, mappato e toccato Thalia.

    // ===== Standard KSR =====
    maxCompletions = 1
    cancellable = true
    declinable = true
    autoAccept = false

    minExpiry = 42600.0
    maxExpiry = 42600.0
    deadline = 42600

    rewardFunds = 0
    rewardReputation = 0
    rewardScience = 0
    advanceFunds = 0
    failureFunds = 0
    failureReputation = 0

    prestige = Significant
    targetBody = Thalia

    PARAMETER
    {
        name = FlybyThalia
        type = VesselParameterGroup
        title = Fly-by di Thalia
        define = KSR_Thalia1_Flyby
        targetBody = Thalia
        completeInSequence = false
        disableOnStateChange = true
        completedMessage = KSR: fly-by automatico di Thalia registrato.

        PARAMETER
        {
            name = NoCrew
            type = HasCrew
            minCrew = 0
            maxCrew = 0
            title = Nessun equipaggio a bordo
        }

        PARAMETER
        {
            name = ReachThalia
            type = ReachState
            targetBody = Thalia
            title = Entra nella SOI di Thalia
        }
    }

    PARAMETER
    {
        name = OrbitThalia
        type = VesselParameterGroup
        title = Orbita attorno a Thalia
        define = KSR_Thalia1_Orbit
        targetBody = Thalia
        completeInSequence = false
        disableOnStateChange = true
        completedMessage = KSR: orbita automatica attorno a Thalia registrata.

        PARAMETER
        {
            name = NoCrew
            type = HasCrew
            minCrew = 0
            maxCrew = 0
            title = Nessun equipaggio a bordo
        }

        PARAMETER
        {
            name = Orbit
            type = Orbit
            minPeA = 1
            targetBody = Thalia
            title = Entra in orbita attorno a Thalia
        }
    }

    PARAMETER
    {
        name = LandingThalia
        type = VesselParameterGroup
        title = Atterraggio su Thalia
        define = KSR_Thalia1_Landing
        targetBody = Thalia
        completeInSequence = false
        disableOnStateChange = true
        completedMessage = KSR: atterraggio automatico su Thalia registrato.

        PARAMETER
        {
            name = NewVessel
            type = NewVessel
            disableOnStateChange = true
            title = Nuovo veicolo
        }

        PARAMETER
        {
            name = NoCrew
            type = HasCrew
            minCrew = 0
            maxCrew = 0
            title = Nessun equipaggio a bordo
        }

        PARAMETER
        {
            name = Landed
            type = ReachState
            targetBody = Thalia
            situation = LANDED
            title = Atterra su Thalia
        }

        PARAMETER
        {
            name = ProbeIntegrity
            type = VesselNotDestroyed
            title = Mantieni il lander integro e operativo
        }

        PARAMETER
        {
            name = ProbeTransmission
            type = CollectScience
            targetBody = Thalia
            location = Surface
            recoveryMethod = Transmit
            title = Trasmetti dati scientifici dalla superficie di Thalia con il lander
            disableOnStateChange = true
        }
    }

    PARAMETER
    {
        name = RoverThalia
        type = VesselParameterGroup
        title = Rover su Thalia
        define = KSR_Thalia1_Rover
        targetBody = Thalia
        completeInSequence = false
        disableOnStateChange = true
        completedMessage = KSR: rover automatico su Thalia registrato.

        PARAMETER
        {
            name = NewVessel
            type = NewVessel
            disableOnStateChange = true
            title = Nuovo veicolo
        }

        PARAMETER
        {
            name = NoCrew
            type = HasCrew
            minCrew = 0
            maxCrew = 0
            title = Nessun equipaggio a bordo
        }

        PARAMETER
        {
            name = Landed
            type = ReachState
            targetBody = Thalia
            situation = LANDED
            title = Atterra il rover su Thalia
        }

        PARAMETER
        {
            name = RoverWheels
            type = PartValidation
            partModule = ModuleWheelMotor
            minCount = 4
            title = Rover con almeno 4 ruote
        }

        PARAMETER
        {
            name = ProbeIntegrity
            type = VesselNotDestroyed
            title = Mantieni il rover integro e operativo
        }

        PARAMETER
        {
            name = ProbeTransmission
            type = CollectScience
            targetBody = Thalia
            location = Surface
            recoveryMethod = Transmit
            title = Trasmetti dati scientifici dalla superficie di Thalia con il rover
            disableOnStateChange = true
        }
    }

    PARAMETER
    {
        name = SCANsatCoverage_AltimetryLoRes
        type = SCANsatCoverage
        targetBody = Thalia
        coverage = 90.0
        scanType = AltimetryLoRes
        title = Scansione altimetrica L.D. di Thalia al 90%
        disableOnStateChange = true
        completedMessage = KSR: scansione altimetrica L.D. di Thalia completata al 90%.
    }

    PARAMETER
    {
        name = SCANsatCoverage_VisualLoRes
        type = SCANsatCoverage
        targetBody = Thalia
        coverage = 90.0
        scanType = VisualLoRes
        title = Scansione fotografica di Thalia al 90%
        disableOnStateChange = true
        completedMessage = KSR: scansione fotografica di Thalia completata al 90%.
    }
}

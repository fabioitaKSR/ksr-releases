CONTRACT_TYPE
{
    name = Niven1
    title = [Niven1] 1a Corsa a Niven
    group = KerbalSpaceRace
    agent = KerbalSpaceRace

    description = Completa la prima missione automatica verso Niven: fly-by, orbita, atterraggio, rover, scansione altimetrica a bassa definizione e scansione fotografica.
    synopsis = Prima campagna automatica su Niven.
    completedMessage = La 1a Corsa a Niven e' completata. Il programma KSR ha raggiunto, mappato e toccato Niven.

    // ===== Standard KSR =====
    maxCompletions = 1
    cancellable = true
    declinable = true
    autoAccept = false

    minExpiry = 42600.0
    maxExpiry = 42600.0
    deadline = 42600

    rewardFunds = 0
    rewardReputation = 0
    rewardScience = 0
    advanceFunds = 0
    failureFunds = 0
    failureReputation = 0

    prestige = Significant
    targetBody = Niven

    PARAMETER
    {
        name = FlybyNiven
        type = VesselParameterGroup
        title = Fly-by di Niven
        define = KSR_Niven1_Flyby
        targetBody = Niven
        completeInSequence = false
        disableOnStateChange = true
        completedMessage = KSR: fly-by automatico di Niven registrato.

        PARAMETER
        {
            name = NoCrew
            type = HasCrew
            minCrew = 0
            maxCrew = 0
            title = Nessun equipaggio a bordo
        }

        PARAMETER
        {
            name = ReachNiven
            type = ReachState
            targetBody = Niven
            title = Entra nella SOI di Niven
        }
    }

    PARAMETER
    {
        name = OrbitNiven
        type = VesselParameterGroup
        title = Orbita attorno a Niven
        define = KSR_Niven1_Orbit
        targetBody = Niven
        completeInSequence = false
        disableOnStateChange = true
        completedMessage = KSR: orbita automatica attorno a Niven registrata.

        PARAMETER
        {
            name = NoCrew
            type = HasCrew
            minCrew = 0
            maxCrew = 0
            title = Nessun equipaggio a bordo
        }

        PARAMETER
        {
            name = Orbit
            type = Orbit
            minPeA = 1
            targetBody = Niven
            title = Entra in orbita attorno a Niven
        }
    }

    PARAMETER
    {
        name = LandingNiven
        type = VesselParameterGroup
        title = Atterraggio su Niven
        define = KSR_Niven1_Landing
        targetBody = Niven
        completeInSequence = false
        disableOnStateChange = true
        completedMessage = KSR: atterraggio automatico su Niven registrato.

        PARAMETER
        {
            name = NewVessel
            type = NewVessel
            disableOnStateChange = true
            title = Nuovo veicolo
        }

        PARAMETER
        {
            name = NoCrew
            type = HasCrew
            minCrew = 0
            maxCrew = 0
            title = Nessun equipaggio a bordo
        }

        PARAMETER
        {
            name = Landed
            type = ReachState
            targetBody = Niven
            situation = LANDED
            title = Atterra su Niven
        }

        PARAMETER
        {
            name = ProbeIntegrity
            type = VesselNotDestroyed
            title = Mantieni il lander integro e operativo
        }

        PARAMETER
        {
            name = ProbeTransmission
            type = CollectScience
            targetBody = Niven
            location = Surface
            recoveryMethod = Transmit
            title = Trasmetti dati scientifici dalla superficie di Niven con il lander
            disableOnStateChange = true
        }
    }

    PARAMETER
    {
        name = RoverNiven
        type = VesselParameterGroup
        title = Rover su Niven
        define = KSR_Niven1_Rover
        targetBody = Niven
        completeInSequence = false
        disableOnStateChange = true
        completedMessage = KSR: rover automatico su Niven registrato.

        PARAMETER
        {
            name = NewVessel
            type = NewVessel
            disableOnStateChange = true
            title = Nuovo veicolo
        }

        PARAMETER
        {
            name = NoCrew
            type = HasCrew
            minCrew = 0
            maxCrew = 0
            title = Nessun equipaggio a bordo
        }

        PARAMETER
        {
            name = Landed
            type = ReachState
            targetBody = Niven
            situation = LANDED
            title = Atterra il rover su Niven
        }

        PARAMETER
        {
            name = RoverWheels
            type = PartValidation
            partModule = ModuleWheelMotor
            minCount = 4
            title = Rover con almeno 4 ruote
        }

        PARAMETER
        {
            name = ProbeIntegrity
            type = VesselNotDestroyed
            title = Mantieni il rover integro e operativo
        }

        PARAMETER
        {
            name = ProbeTransmission
            type = CollectScience
            targetBody = Niven
            location = Surface
            recoveryMethod = Transmit
            title = Trasmetti dati scientifici dalla superficie di Niven con il rover
            disableOnStateChange = true
        }
    }

    PARAMETER
    {
        name = SCANsatCoverage_AltimetryLoRes
        type = SCANsatCoverage
        targetBody = Niven
        coverage = 90.0
        scanType = AltimetryLoRes
        title = Scansione altimetrica L.D. di Niven al 90%
        disableOnStateChange = true
        completedMessage = KSR: scansione altimetrica L.D. di Niven completata al 90%.
    }

    PARAMETER
    {
        name = SCANsatCoverage_VisualLoRes
        type = SCANsatCoverage
        targetBody = Niven
        coverage = 90.0
        scanType = VisualLoRes
        title = Scansione fotografica di Niven al 90%
        disableOnStateChange = true
        completedMessage = KSR: scansione fotografica di Niven completata al 90%.
    }
}

CONTRACT_TYPE
{
    name = Tellumo1
    title = [Tellumo1] 1a Corsa a Tellumo
    group = KerbalSpaceRace
    agent = KerbalSpaceRace

    description = Completa la prima missione automatica verso Tellumo: fly-by, orbita, atterraggio, rover, scansione altimetrica a bassa definizione e scansione fotografica.
    synopsis = Prima campagna automatica su Tellumo.
    completedMessage = La 1a Corsa a Tellumo e' completata. Il programma KSR ha raggiunto, mappato e toccato Tellumo.

    // ===== Standard KSR =====
    maxCompletions = 1
    cancellable = true
    declinable = true
    autoAccept = false

    minExpiry = 42600.0
    maxExpiry = 42600.0
    deadline = 42600

    rewardFunds = 0
    rewardReputation = 0
    rewardScience = 0
    advanceFunds = 0
    failureFunds = 0
    failureReputation = 0

    prestige = Significant
    targetBody = Tellumo

    PARAMETER
    {
        name = FlybyTellumo
        type = VesselParameterGroup
        title = Fly-by di Tellumo
        define = KSR_Tellumo1_Flyby
        targetBody = Tellumo
        completeInSequence = false
        disableOnStateChange = true
        completedMessage = KSR: fly-by automatico di Tellumo registrato.

        PARAMETER
        {
            name = NoCrew
            type = HasCrew
            minCrew = 0
            maxCrew = 0
            title = Nessun equipaggio a bordo
        }

        PARAMETER
        {
            name = ReachTellumo
            type = ReachState
            targetBody = Tellumo
            title = Entra nella SOI di Tellumo
        }
    }

    PARAMETER
    {
        name = OrbitTellumo
        type = VesselParameterGroup
        title = Orbita attorno a Tellumo
        define = KSR_Tellumo1_Orbit
        targetBody = Tellumo
        completeInSequence = false
        disableOnStateChange = true
        completedMessage = KSR: orbita automatica attorno a Tellumo registrata.

        PARAMETER
        {
            name = NoCrew
            type = HasCrew
            minCrew = 0
            maxCrew = 0
            title = Nessun equipaggio a bordo
        }

        PARAMETER
        {
            name = Orbit
            type = Orbit
            minPeA = 1
            targetBody = Tellumo
            title = Entra in orbita attorno a Tellumo
        }
    }

    PARAMETER
    {
        name = LandingTellumo
        type = VesselParameterGroup
        title = Atterraggio su Tellumo
        define = KSR_Tellumo1_Landing
        targetBody = Tellumo
        completeInSequence = false
        disableOnStateChange = true
        completedMessage = KSR: atterraggio automatico su Tellumo registrato.

        PARAMETER
        {
            name = NewVessel
            type = NewVessel
            disableOnStateChange = true
            title = Nuovo veicolo
        }

        PARAMETER
        {
            name = NoCrew
            type = HasCrew
            minCrew = 0
            maxCrew = 0
            title = Nessun equipaggio a bordo
        }

        PARAMETER
        {
            name = Landed
            type = ReachState
            targetBody = Tellumo
            situation = LANDED
            title = Atterra su Tellumo
        }

        PARAMETER
        {
            name = ProbeIntegrity
            type = VesselNotDestroyed
            title = Mantieni il lander integro e operativo
        }

        PARAMETER
        {
            name = ProbeTransmission
            type = CollectScience
            targetBody = Tellumo
            location = Surface
            recoveryMethod = Transmit
            title = Trasmetti dati scientifici dalla superficie di Tellumo con il lander
            disableOnStateChange = true
        }
    }

    PARAMETER
    {
        name = RoverTellumo
        type = VesselParameterGroup
        title = Rover su Tellumo
        define = KSR_Tellumo1_Rover
        targetBody = Tellumo
        completeInSequence = false
        disableOnStateChange = true
        completedMessage = KSR: rover automatico su Tellumo registrato.

        PARAMETER
        {
            name = NewVessel
            type = NewVessel
            disableOnStateChange = true
            title = Nuovo veicolo
        }

        PARAMETER
        {
            name = NoCrew
            type = HasCrew
            minCrew = 0
            maxCrew = 0
            title = Nessun equipaggio a bordo
        }

        PARAMETER
        {
            name = Landed
            type = ReachState
            targetBody = Tellumo
            situation = LANDED
            title = Atterra il rover su Tellumo
        }

        PARAMETER
        {
            name = RoverWheels
            type = PartValidation
            partModule = ModuleWheelMotor
            minCount = 4
            title = Rover con almeno 4 ruote
        }

        PARAMETER
        {
            name = ProbeIntegrity
            type = VesselNotDestroyed
            title = Mantieni il rover integro e operativo
        }

        PARAMETER
        {
            name = ProbeTransmission
            type = CollectScience
            targetBody = Tellumo
            location = Surface
            recoveryMethod = Transmit
            title = Trasmetti dati scientifici dalla superficie di Tellumo con il rover
            disableOnStateChange = true
        }
    }

    PARAMETER
    {
        name = SCANsatCoverage_AltimetryLoRes
        type = SCANsatCoverage
        targetBody = Tellumo
        coverage = 90.0
        scanType = AltimetryLoRes
        title = Scansione altimetrica L.D. di Tellumo al 90%
        disableOnStateChange = true
        completedMessage = KSR: scansione altimetrica L.D. di Tellumo completata al 90%.
    }

    PARAMETER
    {
        name = SCANsatCoverage_VisualLoRes
        type = SCANsatCoverage
        targetBody = Tellumo
        coverage = 90.0
        scanType = VisualLoRes
        title = Scansione fotografica di Tellumo al 90%
        disableOnStateChange = true
        completedMessage = KSR: scansione fotografica di Tellumo completata al 90%.
    }
}

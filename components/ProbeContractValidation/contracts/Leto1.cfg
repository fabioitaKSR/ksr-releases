CONTRACT_TYPE
{
    name = Leto1
    title = [Leto1] 1a Corsa a Leto
    group = KerbalSpaceRace
    agent = KerbalSpaceRace

    description = Completa la prima missione automatica verso Leto: fly-by, orbita, atterraggio, rover, scansione altimetrica a bassa definizione e scansione fotografica.
    synopsis = Prima campagna automatica su Leto.
    completedMessage = La 1a Corsa a Leto e' completata. Il programma KSR ha raggiunto, mappato e toccato Leto.

    // ===== Standard KSR =====
    maxCompletions = 1
    cancellable = true
    declinable = true
    autoAccept = false

    minExpiry = 42600.0
    maxExpiry = 42600.0
    deadline = 42600

    rewardFunds = 0
    rewardReputation = 0
    rewardScience = 0
    advanceFunds = 0
    failureFunds = 0
    failureReputation = 0

    prestige = Significant
    targetBody = Leto

    PARAMETER
    {
        name = FlybyLeto
        type = VesselParameterGroup
        title = Fly-by di Leto
        define = KSR_Leto1_Flyby
        targetBody = Leto
        completeInSequence = false
        disableOnStateChange = true
        completedMessage = KSR: fly-by automatico di Leto registrato.

        PARAMETER
        {
            name = NoCrew
            type = HasCrew
            minCrew = 0
            maxCrew = 0
            title = Nessun equipaggio a bordo
        }

        PARAMETER
        {
            name = ReachLeto
            type = ReachState
            targetBody = Leto
            title = Entra nella SOI di Leto
        }
    }

    PARAMETER
    {
        name = OrbitLeto
        type = VesselParameterGroup
        title = Orbita attorno a Leto
        define = KSR_Leto1_Orbit
        targetBody = Leto
        completeInSequence = false
        disableOnStateChange = true
        completedMessage = KSR: orbita automatica attorno a Leto registrata.

        PARAMETER
        {
            name = NoCrew
            type = HasCrew
            minCrew = 0
            maxCrew = 0
            title = Nessun equipaggio a bordo
        }

        PARAMETER
        {
            name = Orbit
            type = Orbit
            minPeA = 1
            targetBody = Leto
            title = Entra in orbita attorno a Leto
        }
    }

    PARAMETER
    {
        name = LandingLeto
        type = VesselParameterGroup
        title = Atterraggio su Leto
        define = KSR_Leto1_Landing
        targetBody = Leto
        completeInSequence = false
        disableOnStateChange = true
        completedMessage = KSR: atterraggio automatico su Leto registrato.

        PARAMETER
        {
            name = NewVessel
            type = NewVessel
            disableOnStateChange = true
            title = Nuovo veicolo
        }

        PARAMETER
        {
            name = NoCrew
            type = HasCrew
            minCrew = 0
            maxCrew = 0
            title = Nessun equipaggio a bordo
        }

        PARAMETER
        {
            name = Landed
            type = ReachState
            targetBody = Leto
            situation = LANDED
            title = Atterra su Leto
        }

        PARAMETER
        {
            name = ProbeIntegrity
            type = VesselNotDestroyed
            title = Mantieni il lander integro e operativo
        }

        PARAMETER
        {
            name = ProbeTransmission
            type = CollectScience
            targetBody = Leto
            location = Surface
            recoveryMethod = Transmit
            title = Trasmetti dati scientifici dalla superficie di Leto con il lander
            disableOnStateChange = true
        }
    }

    PARAMETER
    {
        name = RoverLeto
        type = VesselParameterGroup
        title = Rover su Leto
        define = KSR_Leto1_Rover
        targetBody = Leto
        completeInSequence = false
        disableOnStateChange = true
        completedMessage = KSR: rover automatico su Leto registrato.

        PARAMETER
        {
            name = NewVessel
            type = NewVessel
            disableOnStateChange = true
            title = Nuovo veicolo
        }

        PARAMETER
        {
            name = NoCrew
            type = HasCrew
            minCrew = 0
            maxCrew = 0
            title = Nessun equipaggio a bordo
        }

        PARAMETER
        {
            name = Landed
            type = ReachState
            targetBody = Leto
            situation = LANDED
            title = Atterra il rover su Leto
        }

        PARAMETER
        {
            name = RoverWheels
            type = PartValidation
            partModule = ModuleWheelMotor
            minCount = 4
            title = Rover con almeno 4 ruote
        }

        PARAMETER
        {
            name = ProbeIntegrity
            type = VesselNotDestroyed
            title = Mantieni il rover integro e operativo
        }

        PARAMETER
        {
            name = ProbeTransmission
            type = CollectScience
            targetBody = Leto
            location = Surface
            recoveryMethod = Transmit
            title = Trasmetti dati scientifici dalla superficie di Leto con il rover
            disableOnStateChange = true
        }
    }

    PARAMETER
    {
        name = SCANsatCoverage_AltimetryLoRes
        type = SCANsatCoverage
        targetBody = Leto
        coverage = 90.0
        scanType = AltimetryLoRes
        title = Scansione altimetrica L.D. di Leto al 90%
        disableOnStateChange = true
        completedMessage = KSR: scansione altimetrica L.D. di Leto completata al 90%.
    }

    PARAMETER
    {
        name = SCANsatCoverage_VisualLoRes
        type = SCANsatCoverage
        targetBody = Leto
        coverage = 90.0
        scanType = VisualLoRes
        title = Scansione fotografica di Leto al 90%
        disableOnStateChange = true
        completedMessage = KSR: scansione fotografica di Leto completata al 90%.
    }
}

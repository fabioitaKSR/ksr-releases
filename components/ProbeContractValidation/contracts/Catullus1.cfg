CONTRACT_TYPE
{
    name = Catullus1
    title = [Catullus1] 1a Corsa a Catullus
    group = KerbalSpaceRace
    agent = KerbalSpaceRace

    description = Completa la prima missione automatica verso Catullus: fly-by, orbita, atterraggio, rover, scansione altimetrica a bassa definizione e scansione fotografica.
    synopsis = Prima campagna automatica su Catullus.
    completedMessage = La 1a Corsa a Catullus e' completata. Il programma KSR ha raggiunto, mappato e toccato Catullus.

    // ===== Standard KSR =====
    maxCompletions = 1
    cancellable = true
    declinable = true
    autoAccept = false

    minExpiry = 42600.0
    maxExpiry = 42600.0
    deadline = 42600

    rewardFunds = 0
    rewardReputation = 0
    rewardScience = 0
    advanceFunds = 0
    failureFunds = 0
    failureReputation = 0

    prestige = Significant
    targetBody = Catullus

    PARAMETER
    {
        name = FlybyCatullus
        type = VesselParameterGroup
        title = Fly-by di Catullus
        define = KSR_Catullus1_Flyby
        targetBody = Catullus
        completeInSequence = false
        disableOnStateChange = true
        completedMessage = KSR: fly-by automatico di Catullus registrato.

        PARAMETER
        {
            name = NoCrew
            type = HasCrew
            minCrew = 0
            maxCrew = 0
            title = Nessun equipaggio a bordo
        }

        PARAMETER
        {
            name = ReachCatullus
            type = ReachState
            targetBody = Catullus
            title = Entra nella SOI di Catullus
        }
    }

    PARAMETER
    {
        name = OrbitCatullus
        type = VesselParameterGroup
        title = Orbita attorno a Catullus
        define = KSR_Catullus1_Orbit
        targetBody = Catullus
        completeInSequence = false
        disableOnStateChange = true
        completedMessage = KSR: orbita automatica attorno a Catullus registrata.

        PARAMETER
        {
            name = NoCrew
            type = HasCrew
            minCrew = 0
            maxCrew = 0
            title = Nessun equipaggio a bordo
        }

        PARAMETER
        {
            name = Orbit
            type = Orbit
            minPeA = 1
            targetBody = Catullus
            title = Entra in orbita attorno a Catullus
        }
    }

    PARAMETER
    {
        name = LandingCatullus
        type = VesselParameterGroup
        title = Atterraggio su Catullus
        define = KSR_Catullus1_Landing
        targetBody = Catullus
        completeInSequence = false
        disableOnStateChange = true
        completedMessage = KSR: atterraggio automatico su Catullus registrato.

        PARAMETER
        {
            name = NewVessel
            type = NewVessel
            disableOnStateChange = true
            title = Nuovo veicolo
        }

        PARAMETER
        {
            name = NoCrew
            type = HasCrew
            minCrew = 0
            maxCrew = 0
            title = Nessun equipaggio a bordo
        }

        PARAMETER
        {
            name = Landed
            type = ReachState
            targetBody = Catullus
            situation = LANDED
            title = Atterra su Catullus
        }

        PARAMETER
        {
            name = ProbeIntegrity
            type = VesselNotDestroyed
            title = Mantieni il lander integro e operativo
        }

        PARAMETER
        {
            name = ProbeTransmission
            type = CollectScience
            targetBody = Catullus
            location = Surface
            recoveryMethod = Transmit
            title = Trasmetti dati scientifici dalla superficie di Catullus con il lander
            disableOnStateChange = true
        }
    }

    PARAMETER
    {
        name = RoverCatullus
        type = VesselParameterGroup
        title = Rover su Catullus
        define = KSR_Catullus1_Rover
        targetBody = Catullus
        completeInSequence = false
        disableOnStateChange = true
        completedMessage = KSR: rover automatico su Catullus registrato.

        PARAMETER
        {
            name = NewVessel
            type = NewVessel
            disableOnStateChange = true
            title = Nuovo veicolo
        }

        PARAMETER
        {
            name = NoCrew
            type = HasCrew
            minCrew = 0
            maxCrew = 0
            title = Nessun equipaggio a bordo
        }

        PARAMETER
        {
            name = Landed
            type = ReachState
            targetBody = Catullus
            situation = LANDED
            title = Atterra il rover su Catullus
        }

        PARAMETER
        {
            name = RoverWheels
            type = PartValidation
            partModule = ModuleWheelMotor
            minCount = 4
            title = Rover con almeno 4 ruote
        }

        PARAMETER
        {
            name = ProbeIntegrity
            type = VesselNotDestroyed
            title = Mantieni il rover integro e operativo
        }

        PARAMETER
        {
            name = ProbeTransmission
            type = CollectScience
            targetBody = Catullus
            location = Surface
            recoveryMethod = Transmit
            title = Trasmetti dati scientifici dalla superficie di Catullus con il rover
            disableOnStateChange = true
        }
    }

    PARAMETER
    {
        name = SCANsatCoverage_AltimetryLoRes
        type = SCANsatCoverage
        targetBody = Catullus
        coverage = 90.0
        scanType = AltimetryLoRes
        title = Scansione altimetrica L.D. di Catullus al 90%
        disableOnStateChange = true
        completedMessage = KSR: scansione altimetrica L.D. di Catullus completata al 90%.
    }

    PARAMETER
    {
        name = SCANsatCoverage_VisualLoRes
        type = SCANsatCoverage
        targetBody = Catullus
        coverage = 90.0
        scanType = VisualLoRes
        title = Scansione fotografica di Catullus al 90%
        disableOnStateChange = true
        completedMessage = KSR: scansione fotografica di Catullus completata al 90%.
    }
}

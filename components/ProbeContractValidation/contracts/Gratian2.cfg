CONTRACT_TYPE
{
    name = Gratian2
    title = [Gratian2] Abilitazione Esplorazione Avanzata Gratian
    group = KerbalSpaceRace
    agent = KerbalSpaceRace

    description = Completa la campagna automatica avanzata su Gratian: scansione ad alta definizione, scansione biomi, rover avanzato con braccio scanner e scansione orbitale delle anomalie.
    synopsis = Abilitazione all'esplorazione umana di Gratian.
    completedMessage = Abilitazione Esplorazione Avanzata Gratian completata. Il programma KSR dispone ora di mappe avanzate e di un rover specializzato su Gratian.

    // ===== Standard KSR =====
    maxCompletions = 1
    cancellable = true
    declinable = true
    autoAccept = false

    minExpiry = 42600.0
    maxExpiry = 42600.0
    deadline = 42600

    rewardFunds = 0
    rewardReputation = 0
    rewardScience = 0
    advanceFunds = 0
    failureFunds = 0
    failureReputation = 0

    prestige = Significant
    targetBody = Gratian

    PARAMETER
    {
        name = SCANsatCoverage_AltimetryHiRes
        type = SCANsatCoverage
        targetBody = Gratian
        coverage = 90.0
        scanType = AltimetryHiRes
        title = Scansione H.D. di Gratian al 90%
        disableOnStateChange = true
        completedMessage = KSR: scansione H.D. di Gratian completata al 90%.
    }

    PARAMETER
    {
        name = SCANsatCoverage_Biome
        type = SCANsatCoverage
        targetBody = Gratian
        coverage = 90.0
        scanType = Biome
        title = Scansione biomi di Gratian al 90%
        disableOnStateChange = true
        completedMessage = KSR: scansione biomi di Gratian completata al 90%.
    }

    PARAMETER
    {
        name = AdvancedRoverGratian
        type = VesselParameterGroup
        title = Rover avanzato su Gratian
        define = KSR_Gratian2_AdvancedRover
        targetBody = Gratian
        completeInSequence = false
        disableOnStateChange = true
        completedMessage = KSR: rover avanzato su Gratian registrato.

        PARAMETER
        {
            name = NewVessel
            type = NewVessel
            disableOnStateChange = true
            title = Nuovo veicolo
        }

        PARAMETER
        {
            name = NoCrew
            type = HasCrew
            minCrew = 0
            maxCrew = 0
            title = Nessun equipaggio a bordo
        }

        PARAMETER
        {
            name = Landed
            type = ReachState
            targetBody = Gratian
            situation = LANDED
            title = Atterra il rover avanzato su Gratian
        }

        PARAMETER
        {
            name = RoverWheels
            type = PartValidation
            partModule = ModuleWheelMotor
            minCount = 4
            title = Rover con almeno 4 ruote
        }

        PARAMETER
        {
            name = ScanArm
            type = PartValidation
            partModule = ModuleRobotArmScanner
            minCount = 1
            title = Braccio scanner installato
        }

        PARAMETER
        {
            name = ProbeIntegrity
            type = VesselNotDestroyed
            title = Mantieni il rover integro e operativo
        }

        PARAMETER
        {
            name = ProbeTransmission
            type = CollectScience
            targetBody = Gratian
            location = Surface
            recoveryMethod = Transmit
            title = Trasmetti dati scientifici dalla superficie di Gratian con il rover
            disableOnStateChange = true
        }
    }

    PARAMETER
    {
        name = SCANsatCoverage_Anomaly
        type = SCANsatCoverage
        targetBody = Gratian
        coverage = 90.0
        scanType = Anomaly
        title = Scansione anomalie di Gratian al 90%
        disableOnStateChange = true
        completedMessage = KSR: scansione anomalie di Gratian completata al 90%.
    }
}

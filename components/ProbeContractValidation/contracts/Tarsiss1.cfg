CONTRACT_TYPE
{
    name = Tarsiss1
    title = [Tarsiss1] 1a Corsa a Tarsiss
    group = KerbalSpaceRace
    agent = KerbalSpaceRace

    description = Completa la prima missione automatica verso Tarsiss: fly-by, orbita, atterraggio, rover, scansione altimetrica a bassa definizione e scansione fotografica.
    synopsis = Prima campagna automatica su Tarsiss.
    completedMessage = La 1a Corsa a Tarsiss e' completata. Il programma KSR ha raggiunto, mappato e toccato Tarsiss.

    // ===== Standard KSR =====
    maxCompletions = 1
    cancellable = true
    declinable = true
    autoAccept = false

    minExpiry = 42600.0
    maxExpiry = 42600.0
    deadline = 42600

    rewardFunds = 0
    rewardReputation = 0
    rewardScience = 0
    advanceFunds = 0
    failureFunds = 0
    failureReputation = 0

    prestige = Significant
    targetBody = Tarsiss

    PARAMETER
    {
        name = FlybyTarsiss
        type = VesselParameterGroup
        title = Fly-by di Tarsiss
        define = KSR_Tarsiss1_Flyby
        targetBody = Tarsiss
        completeInSequence = false
        disableOnStateChange = true
        completedMessage = KSR: fly-by automatico di Tarsiss registrato.

        PARAMETER
        {
            name = NoCrew
            type = HasCrew
            minCrew = 0
            maxCrew = 0
            title = Nessun equipaggio a bordo
        }

        PARAMETER
        {
            name = ReachTarsiss
            type = ReachState
            targetBody = Tarsiss
            title = Entra nella SOI di Tarsiss
        }
    }

    PARAMETER
    {
        name = OrbitTarsiss
        type = VesselParameterGroup
        title = Orbita attorno a Tarsiss
        define = KSR_Tarsiss1_Orbit
        targetBody = Tarsiss
        completeInSequence = false
        disableOnStateChange = true
        completedMessage = KSR: orbita automatica attorno a Tarsiss registrata.

        PARAMETER
        {
            name = NoCrew
            type = HasCrew
            minCrew = 0
            maxCrew = 0
            title = Nessun equipaggio a bordo
        }

        PARAMETER
        {
            name = Orbit
            type = Orbit
            minPeA = 1
            targetBody = Tarsiss
            title = Entra in orbita attorno a Tarsiss
        }
    }

    PARAMETER
    {
        name = LandingTarsiss
        type = VesselParameterGroup
        title = Atterraggio su Tarsiss
        define = KSR_Tarsiss1_Landing
        targetBody = Tarsiss
        completeInSequence = false
        disableOnStateChange = true
        completedMessage = KSR: atterraggio automatico su Tarsiss registrato.

        PARAMETER
        {
            name = NewVessel
            type = NewVessel
            disableOnStateChange = true
            title = Nuovo veicolo
        }

        PARAMETER
        {
            name = NoCrew
            type = HasCrew
            minCrew = 0
            maxCrew = 0
            title = Nessun equipaggio a bordo
        }

        PARAMETER
        {
            name = Landed
            type = ReachState
            targetBody = Tarsiss
            situation = LANDED
            title = Atterra su Tarsiss
        }

        PARAMETER
        {
            name = ProbeIntegrity
            type = VesselNotDestroyed
            title = Mantieni il lander integro e operativo
        }

        PARAMETER
        {
            name = ProbeTransmission
            type = CollectScience
            targetBody = Tarsiss
            location = Surface
            recoveryMethod = Transmit
            title = Trasmetti dati scientifici dalla superficie di Tarsiss con il lander
            disableOnStateChange = true
        }
    }

    PARAMETER
    {
        name = RoverTarsiss
        type = VesselParameterGroup
        title = Rover su Tarsiss
        define = KSR_Tarsiss1_Rover
        targetBody = Tarsiss
        completeInSequence = false
        disableOnStateChange = true
        completedMessage = KSR: rover automatico su Tarsiss registrato.

        PARAMETER
        {
            name = NewVessel
            type = NewVessel
            disableOnStateChange = true
            title = Nuovo veicolo
        }

        PARAMETER
        {
            name = NoCrew
            type = HasCrew
            minCrew = 0
            maxCrew = 0
            title = Nessun equipaggio a bordo
        }

        PARAMETER
        {
            name = Landed
            type = ReachState
            targetBody = Tarsiss
            situation = LANDED
            title = Atterra il rover su Tarsiss
        }

        PARAMETER
        {
            name = RoverWheels
            type = PartValidation
            partModule = ModuleWheelMotor
            minCount = 4
            title = Rover con almeno 4 ruote
        }

        PARAMETER
        {
            name = ProbeIntegrity
            type = VesselNotDestroyed
            title = Mantieni il rover integro e operativo
        }

        PARAMETER
        {
            name = ProbeTransmission
            type = CollectScience
            targetBody = Tarsiss
            location = Surface
            recoveryMethod = Transmit
            title = Trasmetti dati scientifici dalla superficie di Tarsiss con il rover
            disableOnStateChange = true
        }
    }

    PARAMETER
    {
        name = SCANsatCoverage_AltimetryLoRes
        type = SCANsatCoverage
        targetBody = Tarsiss
        coverage = 90.0
        scanType = AltimetryLoRes
        title = Scansione altimetrica L.D. di Tarsiss al 90%
        disableOnStateChange = true
        completedMessage = KSR: scansione altimetrica L.D. di Tarsiss completata al 90%.
    }

    PARAMETER
    {
        name = SCANsatCoverage_VisualLoRes
        type = SCANsatCoverage
        targetBody = Tarsiss
        coverage = 90.0
        scanType = VisualLoRes
        title = Scansione fotografica di Tarsiss al 90%
        disableOnStateChange = true
        completedMessage = KSR: scansione fotografica di Tarsiss completata al 90%.
    }
}

CONTRACT_TYPE
{
    name = Iota1
    title = [Iota1] 1a Corsa a Iota
    group = KerbalSpaceRace
    agent = KerbalSpaceRace

    description = Completa la prima missione automatica verso Iota: fly-by, orbita, atterraggio, rover, scansione altimetrica a bassa definizione e scansione fotografica.
    synopsis = Prima campagna automatica su Iota.
    completedMessage = La 1a Corsa a Iota e' completata. Il programma KSR ha raggiunto, mappato e toccato il primo satellite di Gael.

    // ===== Standard KSR =====
    maxCompletions = 1
    cancellable = true
    declinable = true
    autoAccept = false

    minExpiry = 42600.0
    maxExpiry = 42600.0
    deadline = 42600

    rewardFunds = 0
    rewardReputation = 0
    rewardScience = 0
    advanceFunds = 0
    failureFunds = 0
    failureReputation = 0

    prestige = Significant
    targetBody = Iota

    PARAMETER
    {
        name = FlybyIota
        type = VesselParameterGroup
        title = Fly-by di Iota
        define = KSR_Iota1_Flyby
        targetBody = Iota
        completeInSequence = false
        disableOnStateChange = true
        completedMessage = KSR: fly-by automatico di Iota registrato.

        PARAMETER
        {
            name = NoCrew
            type = HasCrew
            minCrew = 0
            maxCrew = 0
            title = Nessun equipaggio a bordo
        }

        PARAMETER
        {
            name = ReachIota
            type = ReachState
            targetBody = Iota
            title = Entra nella SOI di Iota
        }
    }

    PARAMETER
    {
        name = OrbitIota
        type = VesselParameterGroup
        title = Orbita attorno a Iota
        define = KSR_Iota1_Orbit
        targetBody = Iota
        completeInSequence = false
        disableOnStateChange = true
        completedMessage = KSR: orbita automatica attorno a Iota registrata.

        PARAMETER
        {
            name = NoCrew
            type = HasCrew
            minCrew = 0
            maxCrew = 0
            title = Nessun equipaggio a bordo
        }

        PARAMETER
        {
            name = Orbit
            type = Orbit
            targetBody = Iota
            minPeA = 10000
            title = Entra in orbita attorno a Iota
        }
    }

    PARAMETER
    {
        name = LandingIota
        type = VesselParameterGroup
        title = Atterraggio su Iota
        define = KSR_Iota1_Landing
        targetBody = Iota
        completeInSequence = false
        disableOnStateChange = true
        completedMessage = KSR: atterraggio automatico su Iota registrato.

        PARAMETER
        {
            name = NewVessel
            type = NewVessel
            disableOnStateChange = true
            title = Nuovo veicolo
        }

        PARAMETER
        {
            name = NoCrew
            type = HasCrew
            minCrew = 0
            maxCrew = 0
            title = Nessun equipaggio a bordo
        }

        PARAMETER
        {
            name = Landed
            type = ReachState
            targetBody = Iota
            situation = LANDED
            title = Atterra su Iota
        }

        PARAMETER
        {
            name = ProbeIntegrity
            type = VesselNotDestroyed
            title = Mantieni il lander integro e operativo
        }

        PARAMETER
        {
            name = ProbeTransmission
            type = CollectScience
            targetBody = Iota
            location = Surface
            recoveryMethod = Transmit
            title = Trasmetti dati scientifici dalla superficie di Iota con il lander
            disableOnStateChange = true
        }
    }

    PARAMETER
    {
        name = RoverIota
        type = VesselParameterGroup
        title = Rover su Iota
        define = KSR_Iota1_Rover
        targetBody = Iota
        completeInSequence = false
        disableOnStateChange = true
        completedMessage = KSR: rover automatico su Iota registrato.

        PARAMETER
        {
            name = NewVessel
            type = NewVessel
            disableOnStateChange = true
            title = Nuovo veicolo
        }

        PARAMETER
        {
            name = NoCrew
            type = HasCrew
            minCrew = 0
            maxCrew = 0
            title = Nessun equipaggio a bordo
        }

        PARAMETER
        {
            name = Landed
            type = ReachState
            targetBody = Iota
            situation = LANDED
            title = Atterra il rover su Iota
        }

        PARAMETER
        {
            name = RoverWheels
            type = PartValidation
            partModule = ModuleWheelMotor
            minCount = 4
            title = Rover con almeno 4 ruote
        }

        PARAMETER
        {
            name = ProbeIntegrity
            type = VesselNotDestroyed
            title = Mantieni il rover integro e operativo
        }

        PARAMETER
        {
            name = ProbeTransmission
            type = CollectScience
            targetBody = Iota
            location = Surface
            recoveryMethod = Transmit
            title = Trasmetti dati scientifici dalla superficie di Iota con il rover
            disableOnStateChange = true
        }
    }

    PARAMETER
    {
        name = SCANsatCoverage_AltimetryLoRes
        type = SCANsatCoverage
        targetBody = Iota
        coverage = 90.0
        scanType = AltimetryLoRes
        title = Scansione altimetrica L.D. di Iota al 90%
        disableOnStateChange = true
        completedMessage = KSR: scansione altimetrica L.D. di Iota completata al 90%.
    }

    PARAMETER
    {
        name = SCANsatCoverage_VisualLoRes
        type = SCANsatCoverage
        targetBody = Iota
        coverage = 90.0
        scanType = VisualLoRes
        title = Scansione fotografica di Iota al 90%
        disableOnStateChange = true
        completedMessage = KSR: scansione fotografica di Iota completata al 90%.
    }
}

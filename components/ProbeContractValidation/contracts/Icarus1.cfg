CONTRACT_TYPE
{
    name = Icarus1
    title = [Icarus1] 1a Corsa a Icarus
    group = KerbalSpaceRace
    agent = KerbalSpaceRace

    description = Completa la prima missione automatica verso Icarus: fly-by, orbita, atterraggio, rover, scansione altimetrica a bassa definizione e scansione fotografica.
    synopsis = Prima campagna automatica su Icarus.
    completedMessage = La 1a Corsa a Icarus e' completata. Il programma KSR ha raggiunto, mappato e toccato il primo pianeta interno.

    // ===== Standard KSR =====
    maxCompletions = 1
    cancellable = true
    declinable = true
    autoAccept = false

    minExpiry = 42600.0
    maxExpiry = 42600.0
    deadline = 42600

    rewardFunds = 0
    rewardReputation = 0
    rewardScience = 0
    advanceFunds = 0
    failureFunds = 0
    failureReputation = 0

    prestige = Significant
    targetBody = Icarus

    PARAMETER
    {
        name = FlybyIcarus
        type = VesselParameterGroup
        title = Fly-by di Icarus
        define = KSR_Icarus1_Flyby
        targetBody = Icarus
        completeInSequence = false
        disableOnStateChange = true
        completedMessage = KSR: fly-by automatico di Icarus registrato.

        PARAMETER
        {
            name = NoCrew
            type = HasCrew
            minCrew = 0
            maxCrew = 0
            title = Nessun equipaggio a bordo
        }

        PARAMETER
        {
            name = ReachIcarus
            type = ReachState
            targetBody = Icarus
            title = Entra nella SOI di Icarus
        }
    }

    PARAMETER
    {
        name = OrbitIcarus
        type = VesselParameterGroup
        title = Orbita attorno a Icarus
        define = KSR_Icarus1_Orbit
        targetBody = Icarus
        completeInSequence = false
        disableOnStateChange = true
        completedMessage = KSR: orbita automatica attorno a Icarus registrata.

        PARAMETER
        {
            name = NoCrew
            type = HasCrew
            minCrew = 0
            maxCrew = 0
            title = Nessun equipaggio a bordo
        }

        PARAMETER
        {
            name = Orbit
            type = Orbit
            minPeA = 1
            targetBody = Icarus
            title = Entra in orbita attorno a Icarus
        }
    }

    PARAMETER
    {
        name = LandingIcarus
        type = VesselParameterGroup
        title = Atterraggio su Icarus
        define = KSR_Icarus1_Landing
        targetBody = Icarus
        completeInSequence = false
        disableOnStateChange = true
        completedMessage = KSR: atterraggio automatico su Icarus registrato.

        PARAMETER
        {
            name = NewVessel
            type = NewVessel
            disableOnStateChange = true
            title = Nuovo veicolo
        }

        PARAMETER
        {
            name = NoCrew
            type = HasCrew
            minCrew = 0
            maxCrew = 0
            title = Nessun equipaggio a bordo
        }

        PARAMETER
        {
            name = Landed
            type = ReachState
            targetBody = Icarus
            situation = LANDED
            title = Atterra su Icarus
        }

        PARAMETER
        {
            name = ProbeIntegrity
            type = VesselNotDestroyed
            title = Mantieni il lander integro e operativo
        }

        PARAMETER
        {
            name = ProbeTransmission
            type = CollectScience
            targetBody = Icarus
            location = Surface
            recoveryMethod = Transmit
            title = Trasmetti dati scientifici dalla superficie di Icarus con il lander
            disableOnStateChange = true
        }
    }

    PARAMETER
    {
        name = RoverIcarus
        type = VesselParameterGroup
        title = Rover su Icarus
        define = KSR_Icarus1_Rover
        targetBody = Icarus
        completeInSequence = false
        disableOnStateChange = true
        completedMessage = KSR: rover automatico su Icarus registrato.

        PARAMETER
        {
            name = NewVessel
            type = NewVessel
            disableOnStateChange = true
            title = Nuovo veicolo
        }

        PARAMETER
        {
            name = NoCrew
            type = HasCrew
            minCrew = 0
            maxCrew = 0
            title = Nessun equipaggio a bordo
        }

        PARAMETER
        {
            name = Landed
            type = ReachState
            targetBody = Icarus
            situation = LANDED
            title = Atterra il rover su Icarus
        }

        PARAMETER
        {
            name = RoverWheels
            type = PartValidation
            partModule = ModuleWheelMotor
            minCount = 4
            title = Rover con almeno 4 ruote
        }

        PARAMETER
        {
            name = ProbeIntegrity
            type = VesselNotDestroyed
            title = Mantieni il rover integro e operativo
        }

        PARAMETER
        {
            name = ProbeTransmission
            type = CollectScience
            targetBody = Icarus
            location = Surface
            recoveryMethod = Transmit
            title = Trasmetti dati scientifici dalla superficie di Icarus con il rover
            disableOnStateChange = true
        }
    }

    PARAMETER
    {
        name = SCANsatCoverage_AltimetryLoRes
        type = SCANsatCoverage
        targetBody = Icarus
        coverage = 90.0
        scanType = AltimetryLoRes
        title = Scansione altimetrica L.D. di Icarus al 90%
        disableOnStateChange = true
        completedMessage = KSR: scansione altimetrica L.D. di Icarus completata al 90%.
    }

    PARAMETER
    {
        name = SCANsatCoverage_VisualLoRes
        type = SCANsatCoverage
        targetBody = Icarus
        coverage = 90.0
        scanType = VisualLoRes
        title = Scansione fotografica di Icarus al 90%
        disableOnStateChange = true
        completedMessage = KSR: scansione fotografica di Icarus completata al 90%.
    }
}

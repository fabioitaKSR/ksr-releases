CONTRACT_TYPE
{
    name = Hadrian1
    title = [Hadrian1] 1a Corsa a Hadrian
    group = KerbalSpaceRace
    agent = KerbalSpaceRace

    description = Completa la prima missione automatica verso Hadrian: fly-by, orbita, atterraggio, rover, scansione altimetrica a bassa definizione e scansione fotografica.
    synopsis = Prima campagna automatica su Hadrian.
    completedMessage = La 1a Corsa a Hadrian e' completata. Il programma KSR ha raggiunto, mappato e toccato Hadrian.

    // ===== Standard KSR =====
    maxCompletions = 1
    cancellable = true
    declinable = true
    autoAccept = false

    minExpiry = 42600.0
    maxExpiry = 42600.0
    deadline = 42600

    rewardFunds = 0
    rewardReputation = 0
    rewardScience = 0
    advanceFunds = 0
    failureFunds = 0
    failureReputation = 0

    prestige = Significant
    targetBody = Hadrian

    PARAMETER
    {
        name = FlybyHadrian
        type = VesselParameterGroup
        title = Fly-by di Hadrian
        define = KSR_Hadrian1_Flyby
        targetBody = Hadrian
        completeInSequence = false
        disableOnStateChange = true
        completedMessage = KSR: fly-by automatico di Hadrian registrato.

        PARAMETER
        {
            name = NoCrew
            type = HasCrew
            minCrew = 0
            maxCrew = 0
            title = Nessun equipaggio a bordo
        }

        PARAMETER
        {
            name = ReachHadrian
            type = ReachState
            targetBody = Hadrian
            title = Entra nella SOI di Hadrian
        }
    }

    PARAMETER
    {
        name = OrbitHadrian
        type = VesselParameterGroup
        title = Orbita attorno a Hadrian
        define = KSR_Hadrian1_Orbit
        targetBody = Hadrian
        completeInSequence = false
        disableOnStateChange = true
        completedMessage = KSR: orbita automatica attorno a Hadrian registrata.

        PARAMETER
        {
            name = NoCrew
            type = HasCrew
            minCrew = 0
            maxCrew = 0
            title = Nessun equipaggio a bordo
        }

        PARAMETER
        {
            name = Orbit
            type = Orbit
            minPeA = 1
            targetBody = Hadrian
            title = Entra in orbita attorno a Hadrian
        }
    }

    PARAMETER
    {
        name = LandingHadrian
        type = VesselParameterGroup
        title = Atterraggio su Hadrian
        define = KSR_Hadrian1_Landing
        targetBody = Hadrian
        completeInSequence = false
        disableOnStateChange = true
        completedMessage = KSR: atterraggio automatico su Hadrian registrato.

        PARAMETER
        {
            name = NewVessel
            type = NewVessel
            disableOnStateChange = true
            title = Nuovo veicolo
        }

        PARAMETER
        {
            name = NoCrew
            type = HasCrew
            minCrew = 0
            maxCrew = 0
            title = Nessun equipaggio a bordo
        }

        PARAMETER
        {
            name = Landed
            type = ReachState
            targetBody = Hadrian
            situation = LANDED
            title = Atterra su Hadrian
        }

        PARAMETER
        {
            name = ProbeIntegrity
            type = VesselNotDestroyed
            title = Mantieni il lander integro e operativo
        }

        PARAMETER
        {
            name = ProbeTransmission
            type = CollectScience
            targetBody = Hadrian
            location = Surface
            recoveryMethod = Transmit
            title = Trasmetti dati scientifici dalla superficie di Hadrian con il lander
            disableOnStateChange = true
        }
    }

    PARAMETER
    {
        name = RoverHadrian
        type = VesselParameterGroup
        title = Rover su Hadrian
        define = KSR_Hadrian1_Rover
        targetBody = Hadrian
        completeInSequence = false
        disableOnStateChange = true
        completedMessage = KSR: rover automatico su Hadrian registrato.

        PARAMETER
        {
            name = NewVessel
            type = NewVessel
            disableOnStateChange = true
            title = Nuovo veicolo
        }

        PARAMETER
        {
            name = NoCrew
            type = HasCrew
            minCrew = 0
            maxCrew = 0
            title = Nessun equipaggio a bordo
        }

        PARAMETER
        {
            name = Landed
            type = ReachState
            targetBody = Hadrian
            situation = LANDED
            title = Atterra il rover su Hadrian
        }

        PARAMETER
        {
            name = RoverWheels
            type = PartValidation
            partModule = ModuleWheelMotor
            minCount = 4
            title = Rover con almeno 4 ruote
        }

        PARAMETER
        {
            name = ProbeIntegrity
            type = VesselNotDestroyed
            title = Mantieni il rover integro e operativo
        }

        PARAMETER
        {
            name = ProbeTransmission
            type = CollectScience
            targetBody = Hadrian
            location = Surface
            recoveryMethod = Transmit
            title = Trasmetti dati scientifici dalla superficie di Hadrian con il rover
            disableOnStateChange = true
        }
    }

    PARAMETER
    {
        name = SCANsatCoverage_AltimetryLoRes
        type = SCANsatCoverage
        targetBody = Hadrian
        coverage = 90.0
        scanType = AltimetryLoRes
        title = Scansione altimetrica L.D. di Hadrian al 90%
        disableOnStateChange = true
        completedMessage = KSR: scansione altimetrica L.D. di Hadrian completata al 90%.
    }

    PARAMETER
    {
        name = SCANsatCoverage_VisualLoRes
        type = SCANsatCoverage
        targetBody = Hadrian
        coverage = 90.0
        scanType = VisualLoRes
        title = Scansione fotografica di Hadrian al 90%
        disableOnStateChange = true
        completedMessage = KSR: scansione fotografica di Hadrian completata al 90%.
    }
}

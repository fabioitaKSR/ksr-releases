// Offer expiry and completion deadlines are separate Contract Configurator fields.
@CONTRACT_TYPE[SCAN_Trivial]:HAS[#group[ScanSatOfficial]]:NEEDS[SCANsat,ContractConfigurator]:FINAL
{
    @minExpiry = 30
    @maxExpiry = 60
    @deadline = Random(300, 500) * @/targetBodyValid1.Multiplier() * 2
}

@CONTRACT_TYPE[SCAN_Significant]:HAS[#group[ScanSatOfficial]]:NEEDS[SCANsat,ContractConfigurator]:FINAL
{
    @minExpiry = 30
    @maxExpiry = 60
    @deadline = Random(300, 500) * @/targetBodyValid2.Multiplier() * 2
}

@CONTRACT_TYPE[SCAN_Exceptional]:HAS[#group[ScanSatOfficial]]:NEEDS[SCANsat,ContractConfigurator]:FINAL
{
    @minExpiry = 30
    @maxExpiry = 60
    @deadline = Random(300, 500) * @/targetBodyValid3.Multiplier() * 2
}

name: Verify locally signed launcher release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing locally signed draft release tag
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test launcher
        run: dotnet run --project launcher/tests/KsrLauncher.Tests/KsrLauncher.Tests.csproj -c Release
      - name: Verify signed draft without rebuilding signed executables
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Invalid release tag.' }
          $releases = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json
          $matches = @($releases | Where-Object tag_name -eq $env:RELEASE_TAG)
          if ($matches.Count -ne 1) { throw 'Target must be one unambiguous draft release.' }
          $release = $matches[0]
          if (-not $release.draft) { throw 'Verification requires a draft release.' }
          gh release download $env:RELEASE_TAG --dir release-output --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Draft download failed.' }
          dotnet run --project launcher/src/KsrLauncher.Cli/KsrLauncher.Cli.csproj -c Release -- verify-release --directory release-output
          if ($LASTEXITCODE -ne 0) { throw 'Release authenticity verification failed.' }
          dotnet run --project launcher/src/KsrLauncher.Cli/KsrLauncher.Cli.csproj -c Release -- validate-manifest --manifest release-output/ksr-release.json
          if ($LASTEXITCODE -ne 0) { throw 'Manifest validation failed.' }
          # Signing is performed on the owner's PC; no private key is stored in GitHub.
